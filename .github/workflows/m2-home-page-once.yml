name: M2 Home page - one-time guarded testsite deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m2-home-page-once.yml

permissions:
  contents: read

concurrency:
  group: mosa-2-testsite-sftp
  cancel-in-progress: false

jobs:
  home:
    if: >-
      github.repository == 'masterxfix/MOSA-2' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'M2 one-time deploy new Home page'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed Home page revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6ae664f96ebca5a6dacd0b9e658ed1680ef3400a
          persist-credentials: false

      - name: Verify the generated shell and Home links
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6ae664f96ebca5a6dacd0b9e658ed1680ef3400a"
          python3 scripts/build_pages.py --check
          python3 -m unittest discover -s tests -p 'test_home_page.py' -v
          node --check assets/js/navigation.js
          node tests/isin_automation_browser_check.cjs

      - name: Chrome screenshot and navigation smoke against isolated local assets
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/m2-home-fixture.log 2>&1 &
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          BASE='http://127.0.0.1:8766'
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
              desktop=browser.new_page(viewport={'width':1440,'height':960},locale='de-DE',timezone_id='Europe/Berlin')
              response=desktop.goto(BASE+'/',wait_until='domcontentloaded',timeout=20000)
              assert response and response.status==200
              desktop.locator('nav a[data-page="home"]').click()
              desktop.wait_for_url(BASE+'/home.html')
              assert desktop.locator('body.home-page').count()==1
              assert desktop.locator('nav a[data-page="home"][aria-current="page"]').count()==1
              assert desktop.get_by_role('heading',name='Geräte',exact=True).is_visible()
              assert desktop.get_by_role('heading',name='Räume und Szenen',exact=True).is_visible()
              assert desktop.get_by_role('heading',name='Netzwerk und Gateways',exact=True).is_visible()
              assert desktop.locator('main button').count()==0
              desktop.wait_for_function("""() => document.querySelector('[data-page-load-time]')?.textContent?.trim() !== '— ms'""")
              latency=desktop.locator('[data-page-load-time]').inner_text().strip()
              ms=float(latency.removesuffix(' ms')) if latency.endswith(' ms') else float(latency.removesuffix(' s').replace(',','.'))*1000
              assert ms<2000,latency
              desktop.screenshot(path='m2-home-desktop.png',full_page=True)
              desktop.locator('nav a[data-page="overview"]').click()
              desktop.wait_for_url(BASE+'/')
              assert desktop.locator('body.overview-page').count()==1
              mobile=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=1,locale='de-DE',timezone_id='Europe/Berlin')
              response=mobile.goto(BASE+'/home.html',wait_until='domcontentloaded',timeout=20000)
              assert response and response.status==200
              assert mobile.locator('main#m2-home-title').count()==0
              assert mobile.locator('#m2-home-title').is_visible()
              assert mobile.locator('.m2-home-grid').first.evaluate('(el) => getComputedStyle(el).gridTemplateColumns.split(" ").length')==1
              mobile.screenshot(path='m2-home-mobile.png',full_page=True)
              print('Home navigation SPA/direct, layout, mobile and latency: PASS')
              print('Home measured browser load:',latency)
              browser.close()
          PY

      - name: Retain isolated browser screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-home-browser-screenshots
          path: m2-home-*.png
          retention-days: 5
          if-no-files-found: error

      - name: Validate existing SFTP deployment guardrails
        run: |
          python3 -m unittest discover -s tests -p 'test_deploy*.py' -v
          python3 scripts/deploy_sftp.py validate

      - name: Install pinned SFTP dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt

      - name: Back up explicit existing M2 web files
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_SFTP_FILES: '["index.html","marktdaten.html","home.html","anbieter-labor.html","assets/main-home.html","assets/css/main.css"]'
        run: |
          set -euo pipefail
          python3 scripts/deploy_test_sftp.py check-config
          python3 scripts/deploy_test_sftp.py backup

      - name: Retain encrypted testsite rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-home-web-encrypted-backup
          path: ${{ runner.temp }}/mosa2-web-backup.sealed.json
          retention-days: 7
          if-no-files-found: error

      - name: Deploy only the six requested M2 web files with server SHA-256 readback
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_SFTP_FILES: '["index.html","marktdaten.html","home.html","anbieter-labor.html","assets/main-home.html","assets/css/main.css"]'
        run: |
          set -euo pipefail
          python3 scripts/deploy_test_sftp.py deploy
          printf 'Reviewed revision: 6ae664f96ebca5a6dacd0b9e658ed1680ef3400a\nNew route: home.html\n' >> "$GITHUB_STEP_SUMMARY"
