name: M2 current ISIN object count (one-time read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-isin-count-once.yml']
permissions:
  contents: read
jobs:
  count:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Read current M2 ISIN count once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Count M2 active primary ISIN registrations with read-only credentials
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import json,sys
          sys.path.insert(0,"scripts")
          import collector_actions as ssh
          import collector_db_locality as remote
          import deploy_test_sftp as profile
          import paramiko
          sql=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)throw new RuntimeException('M2_READ_IDENTITY');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);
          $db->exec('SET SESSION TRANSACTION READ ONLY');$db->beginTransaction();
          if($db->query('SELECT DATABASE()')->fetchColumn()!=='h29077_mosa2_test'
             ||(int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)throw new RuntimeException('M2_READ_ONLY_REQUIRED');
          $active=(int)$db->query("SELECT COUNT(*) FROM m2_asset_identifiers i
              JOIN m2_assets a ON a.entity_id=i.asset_id AND a.status='active'
              JOIN m2_entities e ON e.id=a.entity_id AND e.entity_type='asset' AND e.status='active'
              WHERE i.identifier_type='isin' AND i.scope_key='' AND i.is_primary=1
                AND i.valid_to IS NULL AND (i.valid_from IS NULL OR i.valid_from<=UTC_TIMESTAMP(6))")->fetchColumn();
          $historical=(int)$db->query("SELECT COUNT(*) FROM m2_asset_identifiers WHERE identifier_type='isin'")->fetchColumn();
          $instruments=(int)$db->query('SELECT COUNT(*) FROM m2_assets')->fetchColumn();
          $db->rollBack();
          echo json_encode(['active_registered_isin_objects'=>$active,'all_isin_identifier_rows'=>$historical,'all_asset_rows'=>$instruments,'read_only'=>true,'checked_at_utc'=>gmdate('c')],JSON_THROW_ON_ERROR);
          """
          with ssh.ssh_client(profile.configuration(),{},paramiko) as transport:
              phpbin,_=remote.capability(transport)
              rc,out,err,_=remote.remote_call(transport,remote.command(phpbin,remote.BOOTSTRAP),json.dumps({'source':sql}).encode(),timeout=40)
              if rc or err:raise RuntimeError('M2_READ_ONLY_QUERY_FAILED')
              report=json.loads(out)
              if report.get('read_only') is not True:raise RuntimeError('M2_READ_ONLY_INCOMPLETE')
              print('M2_ISIN_DB_COUNT '+json.dumps(report),flush=True)
          PY
