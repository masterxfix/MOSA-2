name: M2 schema 7 market compatibility targeted regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-schema7-market-regression-20261113-once.yml']
permissions: {contents: read}
jobs:
  test:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'Test M2 schema7 market collector compatibility before activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Targeted syntax, scoped schema extension, market sources and unchanged legacy regression
        run: |
          php -l scripts/market_collector/schema_contract.php
          php -l scripts/market_collector/live_persistence.php
          php -l scripts/market_collector/schema6.php
          php -l scripts/phase3k/unit_schema.php
          php -l scripts/market_collector/mosa_tick.php
          php -l tests/test_schema7_additive_market.php
          php tests/test_schema7_additive_market.php
          php tests/test_market_tick_sources.php
          php tests/test_market_registry_model.php
          php tests/test_market_batch_scope.php
          python3 -B -m unittest discover -s tests -p 'test_schema6_compat.py' -v
          python3 -B -m unittest discover -s tests -p 'test_market_selection.py' -v
          python3 -B -m unittest discover -s tests -p 'test_market_general.py' -v
