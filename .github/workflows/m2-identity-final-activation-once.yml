name: M2 identity verified live acceptance and cron activation (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-identity-final-activation-once.yml']
permissions:
  contents: read
concurrency:
  group: mosa2-identity-rollout
  cancel-in-progress: false
jobs:
  validate_and_activate:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Validate and activate verified M2 identity update'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Strict regression and install pinned private M2 release
        env:
          M2_EXPECTED_COMMIT: ${{ github.sha }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          php -l api/market_sources.php
          php -l scripts/market_collector/mosa_tick.php
          php tests/test_market_tick_sources.php
          php tests/test_market_registry_model.php
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
          python3 -B scripts/deploy_market_collector.py install
      - name: Verify new code and live DB identity before touching the M2 cron
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          python3 -B - <<'PY'
          import json,os,shlex,sys,time
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collector_actions as ssh
          import collector_db_locality as remote
          import deploy_market_collector as release
          import deploy_test_sftp as profile
          import paramiko
          old='da145dbdfdb4c21ef933e3094163eecc982f0080'
          sha=os.environ['TARGET_COMMIT']
          root=release.PERIODIC+'/releases/'+sha+'/'
          phpPath=root+'scripts/market_collector/mosa_tick.php'
          sql=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)
              throw new RuntimeException('m2_identity_db_only');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);
          $db->exec('SET SESSION TRANSACTION READ ONLY');$db->beginTransaction();
          if($db->query('SELECT DATABASE()')->fetchColumn()!=='h29077_mosa2_test'
              ||(int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)
              throw new RuntimeException('read_only_required');
          $items=$db->query("SELECT i.normalized_value AS isin,a.display_name AS name,a.asset_class
              FROM m2_asset_identifiers i JOIN m2_assets a ON a.entity_id=i.asset_id AND a.status='active'
              JOIN m2_entities e ON e.id=a.entity_id AND e.status='active'
              WHERE i.identifier_type='isin' AND i.scope_key='' AND i.is_primary=1
              AND i.valid_to IS NULL ORDER BY i.normalized_value")->fetchAll();
          $current=(int)$db->query('SELECT COUNT(*) FROM m2_market_current')->fetchColumn();
          $db->rollBack();
          echo json_encode(['read_only'=>true,'registered'=>$items,'current'=>$current],JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          """
          def cron(t):
              rc,out,err,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if rc!=0 or err or not out or len(out)>32768:raise RuntimeError('cron_read_failed')
              return out
          with ssh.ssh_client(profile.configuration(),{},paramiko) as t:
              with paramiko.SFTPClient.from_transport(t) as sftp:
                  for name in ('api/market_sources.php','api/isin_quote.php','scripts/market_collector/mosa_tick.php'):
                      expected=Path(name).read_bytes()
                      with sftp.open(root+name,'rb') as file: actual=file.read(len(expected)+1)
                      if actual!=expected:raise RuntimeError('private_release_byte_mismatch')
              before=cron(t)
              relevant=[ln for ln in before.splitlines(keepends=True)
                  if b'/scripts/market_collector/mosa_tick.php' in ln and not ln.lstrip().startswith(b'#')]
              if len(relevant)!=1 or relevant[0].count(old.encode())!=1:
                  raise RuntimeError('old_M2_cron_pin_unexpected')
              phpbin,_=remote.capability(t)
              report=None
              for attempt in range(5):
                  rc,out,err,_=remote.remote_call(t,shlex.join([phpbin,phpPath]),timeout=180)
                  if rc or err:raise RuntimeError('new_M2_live_collector_error')
                  if out.strip():
                      try: report=json.loads(out)
                      except (ValueError,UnicodeDecodeError):raise RuntimeError('invalid_live_report')
                      break
                  time.sleep(7) # Existing minute collector owns the scheduler lock; avoid overlap.
              if not isinstance(report,dict) or report.get('due',0)<1:
                  raise RuntimeError('new_M2_live_collector_not_observed')
              items=report.get('items',{})
              if not isinstance(items,dict) or not items or any('failure' in v for v in items.values() if isinstance(v,dict)):
                  raise RuntimeError('new_M2_writer_report_failure')
              if not all(v.get('identity') in ('UPDATED','UNCHANGED','NO_EVIDENCE') for v in items.values()):
                  raise RuntimeError('new_M2_identity_readback_failed')
              print(json.dumps({'live_collection':'PASS','due':report['due'],
                  'provider_http':[{'key':v.get('key'),'status':v.get('status')} for v in report.get('provider_requests',[])],
                  'items':{k:{'identity':v.get('identity'),'name':v.get('name'),
                              'class':v.get('asset_class'),'writer':v.get('writer'),
                              'readback':v.get('readback')} for k,v in items.items()}},
                  ensure_ascii=False),flush=True)
              rc,out,err,_=remote.remote_call(t,remote.command(phpbin,remote.BOOTSTRAP),
                                                   json.dumps({'source':sql}).encode(),timeout=40)
              if rc or err:raise RuntimeError('M2_identity_independent_read_failed')
              inventory=json.loads(out)
              if inventory.get('read_only') is not True or inventory.get('current',0)<1:
                  raise RuntimeError('M2_readback_invalid')
              actual={v['isin']:v for v in inventory['registered']}
              required={'CA57778R1001':'equity','IE00BMYDM794':'etf'}
              for isin,klass in required.items():
                  row=actual.get(isin)
                  if row is None or row['asset_class']!=klass or row['name']==isin or len(row['name'])<5:
                      raise RuntimeError('M2_source_identity_not_enriched_'+isin)
              print(json.dumps({'independent_read_only_DB':'PASS',
                   'registered':[{'isin':r['isin'],'name':r['name'],'class':r['asset_class']} for r in inventory['registered']],
                   'current_count':inventory['current']},ensure_ascii=False),flush=True)
              after=before.replace(old.encode(),sha.encode(),1)
              if after==before:raise RuntimeError('cron_replacement_empty')
              rc,out,err,_=remote.remote_call(t,'/usr/bin/crontab -',after,timeout=25)
              if rc or err:raise RuntimeError('cron_update_failed')
              if cron(t)!=after:
                  remote.remote_call(t,'/usr/bin/crontab -',before,timeout=25)
                  raise RuntimeError('cron_readback_failed_rollback_attempted')
              print('PASS new M2-only cron pin '+sha+'; all other entries unchanged',flush=True)
          PY
