name: Manual HKEX annual fundamentals once
run-name: HKEX fundamentals second ${{ inputs.expected_commit }}
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      authorization:
        description: MOSA2-HKEX-FUNDAMENTALS-SECOND-20261102 colon exact commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mosa2-test-hkex-fundamentals-once
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact commit and one-time authorization
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$GITHUB_RUN_NUMBER" = "2"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$AUTHORIZATION" = "MOSA2-HKEX-FUNDAMENTALS-SECOND-20261102:$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Existing pinned SSH and bounded PDF dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/fundamentals-venv"
          "$RUNNER_TEMP/fundamentals-venv/bin/python" -m pip install --disable-pip-version-check --retries 0 -r scripts/requirements-deploy.txt -r scripts/requirements-fundamentals-pdf.txt
      - name: Focused offline catalog and integration tests before access
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          php -l scripts/fundamentals/core.php
          php -l scripts/fundamentals/hkex_evidence.php
          php -l scripts/fundamentals/analysis_read.php
          "$RUNNER_TEMP/fundamentals-venv/bin/python" -B -m unittest discover -s tests -p test_fundamentals_hkex.py -v
          "$RUNNER_TEMP/fundamentals-venv/bin/python" -B -m unittest discover -s tests -p test_fundamentals_esef.py -v
      - name: Two authorized HKEX PDF GETs, evidence, atomic imports and independent analysis
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          AUTHORIZATION: ${{ inputs.authorization }}
          GH_TOKEN: ${{ github.token }}
          HKEX_WORKFLOW: .github/workflows/fundamentals-hkex-once.yml
          HKEX_AUTH_PREFIX: 'MOSA2-HKEX-FUNDAMENTALS-SECOND-20261102:'
          HKEX_EXECUTION_OVERRIDES: '{"CNE100000296":"fundamentals-hkex-byd-20261102-01","CNE100006CQ4":"fundamentals-hkex-ubtech-20261102-01"}'
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_DB_PASSWORD: ${{ secrets.MOSA_TEST_DB_PASSWORD }}
        run: |
          "$RUNNER_TEMP/fundamentals-venv/bin/python" -B scripts/fundamentals_hkex_once.py
