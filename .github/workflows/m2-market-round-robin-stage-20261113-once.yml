name: M2 universal collector durable rotation guarded stage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-market-round-robin-stage-20261113-once.yml']
permissions: {contents: read}
concurrency:
  group: m2-market-rotation-fix-20261113
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'Stage fair M2 rotation release after regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Verify fair cursor selection and unchanged common market module
        run: |
          php -l scripts/market_collector/mosa_tick.php
          php -l tests/test_m2_market_round_robin.php
          php tests/test_m2_market_round_robin.php
          php tests/test_schema7_additive_market.php
          php tests/test_market_tick_sources.php
          php tests/test_market_registry_model.php
          php tests/test_market_batch_scope.php
          python3 -B -m unittest discover -s tests -p 'test_schema6_compat.py' -v
      - name: Install pinned SSH transport dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Install independent private collector release without changing active cron
        env:
          M2_EXPECTED_COMMIT: ${{ github.sha }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/deploy_market_collector.py install
      - name: Verify private state directory, unchanged cron and exact new release bytes
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import os,stat,sys,json
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collector_actions as ssh,collector_db_locality as remote,deploy_market_collector as rel,deploy_test_sftp as cfg,paramiko
          sha=os.environ['GITHUB_SHA']
          root=rel.PERIODIC+'/releases/'+sha+'/'
          with ssh.ssh_client(cfg.configuration(),{},paramiko) as t:
              with paramiko.SFTPClient.from_transport(t) as sf:
                  for name in ['scripts/market_collector/mosa_tick.php',
                     'scripts/market_collector/live_persistence.php',
                     'scripts/market_collector/schema_contract.php',
                     'docs/database/migrations/0007_network_smart_home_core.sql']:
                      raw=Path(name).read_bytes()
                      with sf.open(root+name,'rb') as f:
                          actual=f.read(len(raw)+1)
                      if raw!=actual:raise RuntimeError('M2_PRIVATE_FILE_READBACK_DRIFT')
                  folder=sf.stat(rel.PERIODIC+'/state')
                  if not stat.S_ISDIR(folder.st_mode) or stat.S_IMODE(folder.st_mode)!=0o700:
                      raise RuntimeError('M2_SCHEDULER_STATE_DIRECTORY_INVALID')
              rc,cron,err,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if rc or err:raise RuntimeError('M2_CRON_NOT_READABLE')
              entries=[x for x in cron.splitlines() if b'/scripts/market_collector/mosa_tick.php' in x and not x.lstrip().startswith(b'#')]
              old=b'50eb855ebd0e69bc8e29353239c728d94ae9e678'
              if len(entries)!=1 or entries[0].count(old)!=1 or entries[0].strip().split()[:5]!=[b'*']*5:
                  raise RuntimeError('M2_CRON_ALREADY_MODIFIED_OR_NOT_MINUTELY')
              print('PASS M2_ROUND_ROBIN_PRIVATE_STAGE '+json.dumps({'release':sha,'original_cron_untouched':True,'protected_state':True,'release_file_readback':4}),flush=True)
          PY
