name: M2 activate verified private collector release (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-market-activate-once.yml'
permissions:
  contents: read
concurrency:
  group: mosa2-private-market-install
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'M2 activate pinned collector 2026-11-12'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test generic collector and pinned SFTP client
        run: |
          php -l scripts/market_collector/mosa_tick.php
          php tests/test_market_tick_sources.php
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Change only the verified M2 cron release, with exact readback and restore guard
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import json, re, shlex, sys
          sys.path.insert(0,'scripts')
          import collector_actions as shared
          import collector_db_locality as remote
          import deploy_market_collector as release
          import deploy_test_sftp as profile
          import paramiko
          OLD='ddd0bcf8e0f8e634cf01fbe93f47298c7e3a17dc'
          NEW='4d35f3e1a3abe8d0266f602d9909f3a495fa2684'
          OLD_BYTES=OLD.encode('ascii')
          NEW_BYTES=NEW.encode('ascii')
          def cron(transport):
              code,out,errors,_=remote.remote_call(transport,'/usr/bin/crontab -l',timeout=20)
              if code!=0 or errors or not out or len(out)>32768:
                  raise RuntimeError('M2_CRON_READ_FAILED')
              return out
          def put_cron(transport,raw):
              code,out,errors,_=remote.remote_call(transport,'/usr/bin/crontab -',raw,timeout=25)
              if code!=0 or errors:
                  raise RuntimeError('M2_CRON_UPDATE_FAILED')
          with shared.ssh_client(profile.configuration(),{},paramiko) as transport:
              path=release.PERIODIC+'/releases/'+NEW+'/scripts/market_collector/mosa_tick.php'
              local=Path('scripts/market_collector/mosa_tick.php').read_bytes()
              with paramiko.SFTPClient.from_transport(transport) as sftp:
                  with sftp.open(path,'rb') as f:
                      actual=f.read(len(local)+1)
                  if actual!=local:
                      raise RuntimeError('M2_NEW_RELEASE_READBACK_FAILED')
              original=cron(transport)
              lines=original.splitlines(keepends=True)
              targets=[i for i,line in enumerate(lines) if b'/scripts/market_collector/mosa_tick.php' in line and not line.lstrip().startswith(b'#')]
              if len(targets)!=1 or lines[targets[0]].count(OLD_BYTES)!=1 or NEW_BYTES in original:
                  raise RuntimeError('M2_CRON_SCOPE_DRIFT')
              index=targets[0]
              lines[index]=lines[index].replace(OLD_BYTES,NEW_BYTES,1)
              changed=b''.join(lines)
              if changed==original or changed.count(NEW_BYTES)!=1:
                  raise RuntimeError('M2_CRON_REWRITE_INVALID')
              put_cron(transport,changed)
              if cron(transport)!=changed:
                  put_cron(transport,original)
                  if cron(transport)!=original:
                      raise RuntimeError('M2_CRON_RESTORE_FAILED')
                  raise RuntimeError('M2_CRON_POSTCHECK_FAILED')
              print('PASS: M2 cron now uses verified release '+NEW+' (all other cron entries byte-identical)',flush=True)
              phpbin,_=remote.capability(transport)
              code,out,errors,_=remote.remote_call(transport,shlex.join([phpbin,path]),timeout=160)
              if code!=0 or errors:
                  print('LIVE_CHECK: CLI run not confirmed; verified cron change retained',flush=True)
              else:
                  try: report=json.loads(out)
                  except (ValueError,UnicodeDecodeError): report={}
                  requests=report.get('provider_requests',[])
                  providers=[{'key':r.get('key'),'http_status':r.get('status')} for r in requests if r.get('key') in ('lang_schwarz_search','lang_schwarz_page','tradegate_quote')]
                  statuses=[('writer' if v.get('writer') else 'failure' if v.get('failure') else 'unknown') for v in report.get('items',{}).values()]
                  print(json.dumps({'live_status':'CHECKED' if report else 'NO_REPORT',
                      'registered_count':report.get('registered'),'due_count':report.get('due'),
                      'source_requests':providers,'item_statuses':statuses,
                      'unavailable_count':len(report.get('unavailable',[]))}),flush=True)
          PY
