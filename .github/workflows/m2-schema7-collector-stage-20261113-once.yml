name: M2 collector schema7 guarded private release staging
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-schema7-collector-stage-20261113-once.yml']
permissions: {contents: read}
concurrency:
  group: m2-schema7-collector-rollout
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'Stage M2 schema7 collector release and verify live read-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Pinned SSH transport dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Install immutable M2 private release without switching cron
        env:
          M2_EXPECTED_COMMIT: ${{ github.sha }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/deploy_market_collector.py install
      - name: Independently read-only verify new collector snapshot against actual schema7
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import os,re,sys,json,hashlib
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collector_actions as ssh,collector_db_locality as remote,deploy_market_collector as rel,deploy_test_sftp as profile,paramiko
          NEW=os.environ['GITHUB_SHA']
          OLD='a82439c0ad695e30678af4ca9e34ab98abf634f2'
          root=rel.PERIODIC+'/releases/'+NEW+'/'
          source=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(!is_array($cfg)||($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)
              throw new RuntimeException('READER_SCOPE');
          $p=new PDO($dsn,$cfg['user'],$cfg['password'],[
              PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);
          $p->exec('SET SESSION TRANSACTION READ ONLY');$p->beginTransaction();
          if((int)$p->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)
              throw new RuntimeException('READONLY_REQUIRED');
          $file=$mosa_input['module']??'';
          if(!is_string($file)||!preg_match('~^/var/www/vhosts/web213\\.server10\\.configcenter\\.info/private/mosa2-collector/periodic/releases/[a-f0-9]{40}/scripts/market_collector/live_persistence\\.php$~D',$file))
              throw new RuntimeException('MODULE_SCOPE');
          require_once $file;
          $legacy='NOT_CHECKED';
          try{\Mosa2\MarketLive\snapshot($p,['schema_version'=>6,'allow_current'=>true]);$legacy='UNEXPECTED_PASS';}
          catch(Throwable $e){$legacy=$e->getMessage();}
          if($legacy!=='table_set')throw new RuntimeException('LEGACY_FAIL_CLOSED_CHANGED');
          $state=\Mosa2\MarketLive\snapshot($p,['schema_version'=>6,'allow_current'=>true,'additive_schema_7'=>true]);
          $result=['db'=>$p->query('SELECT DATABASE()')->fetchColumn(),
              'checked_utc'=>gmdate('c'),'snapshot'=>'PASS','legacy_guard'=>$legacy,
              'market_tables_scoped'=>26,'network_extension_tables'=>16,
              'ledger_count'=>count($state['m2_schema_migrations']),
              'market_observations'=>count($state['m2_market_observations']),
              'market_current'=>count($state['m2_market_current']),
              'market_registered'=>count($state['m2_asset_identifiers'])];
          $p->rollBack();
          echo json_encode($result,JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          """
          with ssh.ssh_client(profile.configuration(),{},paramiko) as t:
              with paramiko.SFTPClient.from_transport(t) as sftp:
                  for name in ['scripts/market_collector/schema_contract.php','scripts/market_collector/live_persistence.php',
                      'scripts/market_collector/mosa_tick.php','scripts/phase3k/unit_schema.php',
                      'scripts/market_collector/schema6.php','docs/database/migrations/0007_network_smart_home_core.sql']:
                      expected=Path(name).read_bytes()
                      with sftp.open(root+name,'rb') as fp: got=fp.read(len(expected)+1)
                      if got!=expected:raise RuntimeError('RELEASE_READBACK_DRIFT_'+name)
              rc,cron,err,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if rc or err or len(cron)>32768:raise RuntimeError('M2_CRON_READ_FAILURE')
              ticks=[line for line in cron.splitlines() if b'/scripts/market_collector/mosa_tick.php' in line and not line.lstrip().startswith(b'#')]
              if len(ticks)!=1 or ticks[0].count(OLD.encode())!=1:raise RuntimeError('M2_OLD_CRON_CHANGED')
              phpbin,_=remote.capability(t)
              rc,out,err,_=remote.remote_call(t,remote.command(phpbin,remote.BOOTSTRAP),
                  json.dumps({'source':source,'module':root+'scripts/market_collector/live_persistence.php'}).encode(),timeout=130)
              if rc or err:
                  if err:
                      print('M2_SCHEMA7_PREFLIGHT_FAILED '+err.decode('utf-8','replace').strip()[:350],flush=True)
                  raise RuntimeError('M2_SCHEMA7_LIVE_PREFLIGHT_FAILED')
              result=json.loads(out)
              if result.get('snapshot')!='PASS' or result['ledger_count']!=7 or result['market_current']<1:
                  raise RuntimeError('M2_SCHEMA7_READONLY_NOT_ACCEPTED')
              result['private_release']=NEW
              result['old_cron_untouched']=True
              print('M2_SCHEMA7_LIVE_STAGED '+json.dumps(result,ensure_ascii=False),flush=True)
          PY
