name: M2 concise names fresh browser proof (one-time, read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-compact-name-browser-proof-once.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Visually verify shortened M2 names on fresh browser load'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Fresh browser DOM and image, read-only public testsite
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          import base64,io,html,os,re,shutil,subprocess
          from PIL import Image
          browser=next((p for p in ('google-chrome','google-chrome-stable','chromium','chromium-browser')
                       if shutil.which(p)),None)
          if browser is None:raise RuntimeError('No usable Chrome/Chromium found')
          url='https://mosa2-test.scharwerk.de/marktdaten.html'
          screenshot='/tmp/mosa2-compact-names-fresh.png'
          cmd=[browser,'--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu',
               '--no-first-run','--hide-scrollbars','--window-size=1400,1200',
               '--virtual-time-budget=15000','--screenshot='+screenshot,'--dump-dom',url]
          result=subprocess.run(cmd,capture_output=True,text=True,timeout=95)
          if result.returncode:raise RuntimeError('Headless Chrome exited '+str(result.returncode))
          page=result.stdout
          print('M2_CHROME_DIAGNOSTIC_LEN',len(page),'PREVIEW',repr(page[:1000]),'STDERR',repr(result.stderr[-950:]),flush=True)
          rows=re.findall(r'<tr\b[^>]*>(.*?)</tr>',page,re.S|re.I)
          parsed=[]
          for row in rows:
              cells=re.findall(r'<td\b([^>]*)>(.*?)</td>',row,re.S|re.I)
              if not cells:continue
              labels=[html.unescape(re.sub('<[^>]*>','',v)).strip() for attrs,v in cells]
              parsed.append({'name':labels[0], 'type':labels[1] if len(labels)>1 else '',
                  'isin':labels[8] if len(labels)>8 else '',
                  'full_tooltip':html.unescape(re.search(r'\btitle="([^"]*)"',cells[0][0]).group(1))
                     if re.search(r'\btitle="([^"]*)"',cells[0][0]) else ''})
          target=next((row for row in parsed if row['isin']=='IE00BMYDM794'),None)
          if target is None:raise RuntimeError('ETF row missing in fresh Chrome DOM: '+str(parsed))
          if target['name']!='L&G Hydrogen Economy (Acc)' or target['type']!='ETF':
              raise RuntimeError('ETF live display incorrect: '+str(target))
          if 'L&G Hydrogen Economy UCITS ETF' not in target['full_tooltip']:
              raise RuntimeError('Full provider name tooltip unavailable')
          other=next((r for r in parsed if r['isin']=='CA57778R1001'),None)
          if other is None or other['name']!='Max Power Mining Corp.':
              raise RuntimeError('Ordinary company name regression: '+str(other))
          print('M2_FRESH_BROWSER_PASS',target,other,flush=True)
          img=Image.open(screenshot).convert('RGB')
          img=img.crop((0,200,min(img.width,1400),min(img.height,1180)))
          if img.width>1150:img=img.resize((1150,int(img.height*1150/img.width)))
          buf=io.BytesIO();img.save(buf,format='JPEG',quality=66,optimize=True)
          print('M2_SCREENSHOT_JPEG_B64='+base64.b64encode(buf.getvalue()).decode(),flush=True)
          PY
