name: Install private MOSA 2 market collector

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [install]
        required: true
      expected_commit:
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: mosa2-private-market-install
  cancel-in-progress: false
jobs:
  collector:
    if: inputs.mode == 'install' && github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check collector code and install pinned transport
        run: |
          python3 -m py_compile scripts/deploy_market_collector.py scripts/market_collector/live_bridge.py
          php -l scripts/market_collector/mosa_tick.php
          php -d zend.assertions=1 tests/test_market_batch_scope.php
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Install the private M2 database adapter
        env:
          M2_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/deploy_market_collector.py install
