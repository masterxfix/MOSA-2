name: M2 collector status read-only audit 20261113
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-collector-status-readonly-20261113-once.yml']
permissions: {contents: read}
concurrency:
  group: m2-collector-readonly-audit-20261113
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_number == 3 && github.run_attempt == 1 && github.event.head_commit.message == 'Inspect M2 collector diagnostic log read-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Pinned SSH dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Read only M2 cron active release, fresh observations and provider cooldown
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import json,re,sys
          sys.path.insert(0,'scripts')
          import collector_actions as ssh
          import collector_db_locality as remote
          import deploy_test_sftp as profile
          import paramiko
          source=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(!is_array($cfg)||($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)
              throw new RuntimeException('M2_READER_SCOPE');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[
              PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);
          $db->exec('SET SESSION TRANSACTION READ ONLY');
          $db->beginTransaction();
          if($db->query('SELECT DATABASE()')->fetchColumn()!=='h29077_mosa2_test'
            ||(int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)
              throw new RuntimeException('M2_NOT_READ_ONLY');
          $clock=$db->query('SELECT UTC_TIMESTAMP(6)')->fetchColumn();
          $obs=$db->query("SELECT COUNT(*) AS total, MAX(observed_at) AS newest,
                SUM(observed_at>=UTC_TIMESTAMP()-INTERVAL 10 MINUTE) AS recent_10m,
                SUM(observed_at>=UTC_TIMESTAMP()-INTERVAL 60 MINUTE) AS recent_60m
                FROM m2_market_observations")->fetch();
          $current=$db->query("SELECT i.normalized_value AS isin,s.source_key,
                 c.observed_at,c.market_at,c.currency
                 FROM m2_market_current c
                 JOIN m2_asset_identifiers i ON i.asset_id=c.asset_id AND i.is_primary=1
                 JOIN m2_sources s ON s.id=c.source_id
                 ORDER BY c.observed_at DESC LIMIT 20")->fetchAll();
          $cooldown=$db->query("SELECT s.source_key,c.watermark_at
                FROM m2_sync_checkpoints c JOIN m2_sources s ON s.id=c.source_id
                WHERE c.stream_key='scheduled_market_cooldown'
                ORDER BY s.source_key")->fetchAll();
          $lock=$db->query("SELECT IS_USED_LOCK('m2-collector-scheduler')")->fetchColumn();
          $db->rollBack();
          echo json_encode(['readonly'=>true,'db_clock_utc'=>$clock,'observations'=>$obs,
             'current'=>$current,'cooldowns'=>$cooldown,'scheduler_lock_held_now'=>$lock!==false&&$lock!==null],
             JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          """
          with ssh.ssh_client(profile.configuration(),{},paramiko) as t:
              rc,out,err,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if rc or err or len(out)>32768:raise RuntimeError('CRONTAB_READ_FAILURE')
              matches=[line.decode('utf-8','replace') for line in out.splitlines()
                  if b'/scripts/market_collector/mosa_tick.php' in line and not line.lstrip().startswith(b'#')]
              if len(matches)!=1:raise RuntimeError('M2_COLLECTOR_CRON_NOT_UNIQUELY_ACTIVE:'+str(len(matches)))
              line=matches[0]
              shas=re.findall(r'/releases/([a-f0-9]{40})/',line)
              if len(shas)!=1:raise RuntimeError('M2_CRON_RELEASE_UNRECOGNIZED')
              with paramiko.SFTPClient.from_transport(t) as sftp:
                  release='/var/www/vhosts/web213.server10.configcenter.info/private/mosa2-collector/periodic/releases/'+shas[0]+'/scripts/market_collector/mosa_tick.php'
                  stat=sftp.stat(release)
                  if stat.st_size<2000:raise RuntimeError('M2_COLLECTOR_RELEASE_FILE_INVALID')
              phpbin,_=remote.capability(t)
              rc,data,err,_=remote.remote_call(t,remote.command(phpbin,remote.BOOTSTRAP),
                  json.dumps({'source':source}).encode(),timeout=45)
              if rc or err:raise RuntimeError('M2_DB_READ_ONLY_AUDIT_FAILED')
              state=json.loads(data)
              if state.get('readonly') is not True:raise RuntimeError('M2_READONLY_ASSERT')
              report={'cron_active':True,'cron_unique':True,'active_release':shas[0],
                'cron_minutely':line.lstrip().startswith(('* * * * *','*/1 * * * *')),
                'cron_schedule_tokens':line.strip().split()[:5],
                'release_file_exists':True,'cron_output_discarded':('/dev/null' in line),
                'db':state}
              suffix=line.split('mosa_tick.php',1)[1]
              candidates=re.findall(r'(?:^|\\s)(?:>>?|2>>?)\\s*(/[-\\w./]+)',suffix)
              report['log_redirect_basenames']=[s.rsplit('/',1)[-1] for s in candidates]
              safe_root='/var/www/vhosts/web213.server10.configcenter.info/private/mosa2-collector/'
              for candidate in candidates:
                  if not candidate.startswith(safe_root):continue
                  try:
                      with paramiko.SFTPClient.from_transport(t) as sf:
                          stat=sf.stat(candidate)
                          with sf.open(candidate,'rb') as stream:
                              stream.seek(max(0,stat.st_size-262144))
                              content=stream.read(262144).decode('utf-8','replace')
                      records=[]
                      errors=[]
                      for raw in content.splitlines():
                          try: event=json.loads(raw)
                          except (ValueError,TypeError):
                              if re.fullmatch(r'[a-z0-9_]{1,80}',raw.strip()):errors.append(raw.strip())
                              continue
                          if not isinstance(event,dict) or 'checked_at' not in event:continue
                          items=event.get('items',{})
                          records.append({'at':event.get('checked_at'),
                             'registered':event.get('registered'),'due':event.get('due'),
                             'http':event.get('provider_requests'),
                             'unavailable_count':len(event.get('unavailable',[])),
                             'writers':{k:v.get('writer',v.get('failure',v.get('quote'))) for k,v in items.items() if isinstance(v,dict)}})
                      report['cron_log_readback']={'file':candidate.rsplit('/',1)[-1],
                         'size_bytes':stat.st_size,'recent_entries':records[-8:],
                         'short_errors':errors[-8:]}
                  except (OSError,IOError):
                      report['cron_log_readback']='UNREADABLE'
              print('M2_COLLECTOR_STATUS_AUDIT '+json.dumps(report,ensure_ascii=False),flush=True)
          PY
