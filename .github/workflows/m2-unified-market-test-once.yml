name: M2 unified market regression (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-unified-market-test-once.yml']
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'M2 unified market source regression 2026-11-12'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Lint and shared-source regression (no provider/DB writes)
        run: |
          php -l api/market_sources.php
          php -l api/isin_quote.php
          php -l api/market_source_engine.php
          php -l scripts/market_collector/mosa_tick.php
          php tests/test_market_tick_sources.php
          php tests/fixtures/isin_quote_test.php
          php tests/fixtures/isin_quote_all_test.php
          php tests/test_market_batch_scope.php
          python3 -B -m unittest discover -s tests -p 'test_isin_quote.py' -v
