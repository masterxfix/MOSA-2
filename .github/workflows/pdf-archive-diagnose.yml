name: Read-only PDF archive diagnosis
run-name: PDF archive diagnosis ${{ inputs.expected_commit }}
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      authorization:
        description: MOSA2-PDF-ARCHIVE-DIAGNOSE-20261101 colon exact commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mosa2-test-fundamentals-pilot-once
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Exact commit and one-time authorization
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$AUTHORIZATION" = "MOSA2-PDF-ARCHIVE-DIAGNOSE-20261101:$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Existing pinned SSH dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/fundamentals-venv"
          "$RUNNER_TEMP/fundamentals-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt -r scripts/requirements-fundamentals-pdf.txt
      - name: Focused large-archive and safe-output tests
        run: '"$RUNNER_TEMP/fundamentals-venv/bin/python" -B -m unittest discover -s tests -p test_pdf_archive_diagnose.py -v'
      - name: Read original archive once; no DB access or provider request
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          AUTHORIZATION: ${{ inputs.authorization }}
          GH_TOKEN: ${{ github.token }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: '"$RUNNER_TEMP/fundamentals-venv/bin/python" -B scripts/pdf_archive_diagnose.py'
