name: M2 provider laboratory navigation deployed readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-provider-lab-release-once.yml']
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Verify deployed M2 provider laboratory navigation without redeployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify generated navigation and all four links
        run: |
          set -euo pipefail
          python3 scripts/build_pages.py --check
          python3 - <<'PY'
          from pathlib import Path
          pages=('index.html','marktdaten.html','fundamentaldaten.html','anbieter-labor.html')
          for page in pages:
              html=Path(page).read_text(encoding='utf-8')
              nav=html.split('<nav class="site-nav wrap"',1)[1].split('</nav>',1)[0]
              assert nav.count('href="anbieter-labor.html"')==1,page
              assert nav.count('aria-current="page"')==1,page
              assert ('href="anbieter-labor.html" aria-current="page"' in nav)==(page=='anbieter-labor.html'),page
              print('M2_NAV_LOCAL_PASS '+page)
          PY
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Independent exact-byte SFTP readback of the deployed four HTML pages
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collector_actions as ssh,deploy_test_sftp as deploy,deploy_sftp as shared
          import paramiko
          pages=('index.html','marktdaten.html','fundamentaldaten.html','anbieter-labor.html')
          with ssh.ssh_client(deploy.configuration(),{},paramiko) as transport:
              with paramiko.SFTPClient.from_transport(transport) as sftp:
                  for page in pages:
                      expected=Path(page).read_bytes()
                      with sftp.open(shared.TEST_ROOT+'/'+page,'rb') as stream:
                          actual=stream.read(len(expected)+1)
                      if actual!=expected:raise RuntimeError('M2_NAV_REMOTE_MISMATCH '+page)
                      print('M2_NAV_REMOTE_PASS '+page+' '+hashlib.sha256(actual).hexdigest(),flush=True)
          PY
