name: M2 network schema v0007 isolated MySQL qualification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-network-schema-qualification-once.yml']
permissions: {contents: read}
jobs:
  qualify:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 1 && github.event.head_commit.message == 'Qualify M2 network schema v0007 on isolated MySQL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: mosa2_network_schema_test
          MYSQL_ROOT_PASSWORD: isolated-network-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pisolated-network-fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Verify fixture and exact migration names
        run: |
          php -l tests/test_network_schema_mysql.php
          test "$(grep -c '^CREATE TABLE m2_network_' docs/database/migrations/0007_network_smart_home_core.sql)" -eq 16
      - name: Execute schema and constraint tests against disposable MySQL 8
        env:
          NETWORK_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mosa2_network_schema_test;charset=utf8mb4
          NETWORK_TEST_USER: root
          NETWORK_TEST_PASSWORD: isolated-network-fixture
        run: php tests/test_network_schema_mysql.php
