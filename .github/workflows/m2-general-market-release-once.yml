name: M2 unified market web and collector release (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-general-market-release-once.yml']
permissions:
  contents: read
concurrency:
  group: mosa2-unified-market-rollout
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Release general M2 market module 2026-11-12'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Unit and integration regression before any deployment
        env: {PYTHONPATH: '.:tests'}
        run: |
          php -l api/market_sources.php
          php -l api/isin_quote.php
          php -l api/market_source_engine.php
          php -l scripts/market_collector/mosa_tick.php
          php tests/test_market_tick_sources.php
          php tests/fixtures/isin_quote_test.php
          php tests/fixtures/isin_quote_all_test.php
          php tests/test_market_batch_scope.php
          python3 -B -m unittest discover -s tests -p 'test_isin_quote.py' -v
          python3 -B -m unittest discover -s tests -p 'test_deploy*.py' -v
          python3 scripts/deploy_sftp.py validate
      - name: Install pinned SFTP/SSH tools
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Install exact M2 private collector release with shared source file
        env:
          M2_EXPECTED_COMMIT: ${{ github.sha }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/deploy_market_collector.py install
      - name: Backup and deploy only three M2 testsite web files
        env:
          MOSA_TEST_SFTP_FILES: '["api/market_source_engine.php","api/market_sources.php","api/isin_quote.php"]'
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B scripts/deploy_test_sftp.py check-config
          python3 -B scripts/deploy_test_sftp.py backup
          python3 -B scripts/deploy_test_sftp.py deploy
          printf 'M2 testsite and private release SHA: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
