name: M2 round-robin automatic cron activation and four-ISIN proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-market-fair-rotation-auto-activate-20261113-once.yml']
permissions: {contents: read}
concurrency:
  group: m2-market-rotation-fix-20261113
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 1 && github.event.head_commit.message == 'Activate M2 fair rotation using automatic cron acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Switch only proven M2 private minute cron release and prove live all-ISIN fairness
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import sys,json,time,hashlib,stat
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collector_actions as ssh,collector_db_locality as remote,deploy_market_collector as release,deploy_test_sftp as cfg,paramiko
          OLD='50eb855ebd0e69bc8e29353239c728d94ae9e678'
          NEW='62c348739da1e1b33200c8c50baee63c0b706979'
          tick=release.PERIODIC+'/releases/'+NEW+'/scripts/market_collector/mosa_tick.php'
          cursor=release.PERIODIC+'/state/market-scheduler-cursor-v1.txt'
          source=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(!is_array($cfg)||($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)
              throw new RuntimeException('M2_READER_SCOPE');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[
             PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);$db->exec('SET SESSION TRANSACTION READ ONLY');$db->beginTransaction();
          if((int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)
              throw new RuntimeException('NOT_READ_ONLY');
          $current=$db->query("SELECT i.normalized_value AS isin,c.observed_at,c.market_at,c.price,s.source_key,
              TIMESTAMPDIFF(MINUTE,c.observed_at,UTC_TIMESTAMP()) AS age_minutes
              FROM m2_market_current c
              JOIN m2_asset_identifiers i ON i.asset_id=c.asset_id AND i.is_primary=1
              JOIN m2_sources s ON s.id=c.source_id ORDER BY i.normalized_value")->fetchAll();
          $count=$db->query("SELECT COUNT(*) AS total,MAX(observed_at) AS newest FROM m2_market_observations")->fetch();
          $lock=$db->query("SELECT IS_USED_LOCK('m2-collector-scheduler')")->fetchColumn();
          $db->rollBack();
          echo json_encode(['read_only'=>true,'checked_utc'=>gmdate('c'),'current'=>$current,
              'observations'=>$count,'scheduler_lock_held'=>$lock!==false&&$lock!==null],
              JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          """
          def cron(t):
              rc,out,err,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if rc or err or len(out)>32768:raise RuntimeError('M2_CRON_READ_FAILED')
              return out
          def snapshot(t,php):
              rc,out,err,_=remote.remote_call(t,remote.command(php,remote.BOOTSTRAP),
                  json.dumps({'source':source}).encode(),timeout=50)
              if rc or err:raise RuntimeError('M2_DB_READ_FAILED')
              data=json.loads(out)
              if not data.get('read_only') or len(data['current'])!=4:
                  raise RuntimeError('M2_DB_SCOPE_CHANGED')
              return data
          def mapped(d):return {r['isin']:r for r in d['current']}
          def advances(d,baseline):
              m=mapped(d)
              return {isin:m[isin]['observed_at']>item['observed_at'] for isin,item in baseline.items()}
          with ssh.ssh_client(cfg.configuration(),{},paramiko) as t:
              with paramiko.SFTPClient.from_transport(t) as sf:
                  expect=Path('scripts/market_collector/mosa_tick.php').read_bytes()
                  with sf.open(tick,'rb') as fp:actual=fp.read(len(expect)+1)
                  if actual!=expect:raise RuntimeError('NEW_RELEASE_BYTES_NOT_PROVEN')
                  state_dir=sf.stat(release.PERIODIC+'/state')
                  if stat.S_IMODE(state_dir.st_mode)!=0o700:raise RuntimeError('SCHEDULER_DIR_NOT_PRIVATE')
              original=cron(t)
              chunks=original.splitlines(keepends=True)
              hits=[i for i,line in enumerate(chunks) if b'/scripts/market_collector/mosa_tick.php' in line
                    and not line.lstrip().startswith(b'#')]
              if len(hits)!=1 or chunks[hits[0]].count(OLD.encode())!=1 or chunks[hits[0]].strip().split()[:5]!=[b'*']*5:
                  raise RuntimeError('EXISTING_M2_CRON_NOT_EXACTLY_VERIFIED')
              phpbin,_=remote.capability(t)
              baseline=snapshot(t,phpbin)
              print('M2_FAIR_ROTATION_BASELINE '+json.dumps(baseline,ensure_ascii=False),flush=True)
              chunks[hits[0]]=chunks[hits[0]].replace(OLD.encode(),NEW.encode(),1)
              updated=b''.join(chunks)
              if updated==original:raise RuntimeError('CRON_NOOP')
              rc,out,err,_=remote.remote_call(t,'/usr/bin/crontab -',updated,timeout=25)
              if rc or err:raise RuntimeError('CRON_PIN_WRITE_FAILED')
              if cron(t)!=updated:
                  remote.remote_call(t,'/usr/bin/crontab -',original,timeout=25)
                  if cron(t)!=original:raise RuntimeError('CRON_ROLLBACK_NOT_CONFIRMED')
                  raise RuntimeError('CRON_READBACK_FAILED_RESTORED')
              print('M2_FAIR_ROTATION_CRON_ACTIVE '+json.dumps({'release':NEW,'other_jobs_unchanged':True,
                'before_sha256':hashlib.sha256(original).hexdigest(),
                'after_sha256':hashlib.sha256(updated).hexdigest()},ensure_ascii=False),flush=True)
              before=mapped(baseline)
              now=baseline
              result=None
              for attempt in range(32):
                  time.sleep(20)
                  now=snapshot(t,phpbin)
                  flags=advances(now,before)
                  if attempt%3==0:
                      print('M2_FAIR_ROTATION_WATCH '+json.dumps({'attempt':attempt+1,
                          'fresh':flags,'total_observations':now['observations']['total'],
                          'lock_held':now['scheduler_lock_held']},ensure_ascii=False),flush=True)
                  if all(flags.values()):
                      result=now
                      break
              if result is None:
                  print('M2_FAIR_ROTATION_INCOMPLETE '+json.dumps({'advances':advances(now,before),
                      'current':now['current'],'observations':now['observations']},ensure_ascii=False),flush=True)
                  raise RuntimeError('NOT_ALL_FOUR_ASSETS_UPDATED_BY_AUTOMATIC_CRON')
              if cron(t)!=updated:raise RuntimeError('CRON_PIN_DRIFT_AFTER_ACTIVATION')
              with paramiko.SFTPClient.from_transport(t) as sf:
                  info=sf.stat(cursor)
                  if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode)!=0o600:
                      raise RuntimeError('ROTATION_CURSOR_MISSING_OR_UNPROTECTED')
                  with sf.open(cursor,'rb') as fp:data=fp.read(64)
                  if data not in (b'0\n',b'1\n',b'2\n',b'3\n'):
                      raise RuntimeError('ROTATION_CURSOR_STATE_INVALID')
              print('PASS M2_FAIR_ROTATION_ALL_FOUR_AUTOMATIC '+json.dumps({
                  'active_release':NEW,'scheduler_cursor_readback':data.decode().strip(),
                  'observations_before':baseline['observations'],
                  'observations_after':result['observations'],
                  'current':result['current'],'cron_only':True,
                  'one_existing_job_only':True},ensure_ascii=False),flush=True)
          PY
