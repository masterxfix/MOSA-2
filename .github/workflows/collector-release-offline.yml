name: Manual MOSA 2 offline collector release verification

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed repository commit
        type: string
        required: true
      verification_scope:
        description: Release packaging or pure simulated cycle and collector regressions
        type: choice
        options: [release, cycle, persistence, migration5, schema5, backup-restore, backup-permissions]
        default: release
      backup_stage:
        description: Bounded backup diagnosis, focused correction, or final regression
        type: choice
        options: [full, diagnosis, focused, schema-export, schema-lock]
        default: full
      read_preflight:
        description: Exactly one PREPARE-only read of existing Dogado schema4, on main after isolated tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mosa-2-collector-release-offline
  cancel-in-progress: false

jobs:
  offline:
    if: github.repository == 'masterxfix/MOSA-2' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.verification_scope != 'persistence' && inputs.verification_scope != 'migration5' && inputs.verification_scope != 'schema5' && inputs.verification_scope != 'backup-restore' && inputs.verification_scope != 'backup-permissions'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:tests
    steps:
      - name: Require exact reviewed revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Offline regression and adversarial package checks
        if: inputs.verification_scope != 'cycle'
        run: |
          php -l scripts/collector_release/runtime.php
          python3 -B -m unittest -v test_collector_release test_market_collector_v1 test_market_live_batch test_market_runtime test_runtime_optimization test_deploy_testsite test_deployment
      - name: Pure cycle simulation and existing collector and budget regressions
        if: inputs.verification_scope == 'cycle'
        timeout-minutes: 8
        run: |
          python3 -B -m unittest -v test_collector_cycle test_collector_operation_plan test_provider_budget_plan test_market_collector_v1 test_market_live_batch test_market_runtime
          git diff --exit-code
      - name: Reproducible release and full manifest
        if: inputs.verification_scope != 'cycle'
        run: |
          python3 -B scripts/collector_release.py build --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/mosa2-release"
          python3 -B scripts/collector_release.py verify --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/mosa2-release"
          cat "$RUNNER_TEMP/mosa2-release/$GITHUB_SHA.manifest.json"

  persistence:
    if: github.repository == 'masterxfix/MOSA-2' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && (inputs.verification_scope == 'persistence' || inputs.verification_scope == 'migration5' || (inputs.verification_scope == 'schema5' || inputs.verification_scope == 'backup-restore'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: mosa2_collector_isolated
        ports:
          - 127.0.0.1:3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:tests
    steps:
      - name: Require exact reviewed revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Isolated MySQL client dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/collector-db-venv"
          "$RUNNER_TEMP/collector-db-venv/bin/python" -m pip install --disable-pip-version-check PyMySQL==1.1.2
          "$RUNNER_TEMP/collector-db-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Persistent state and real MySQL8 transaction and locking tests
        if: inputs.verification_scope != 'backup-restore' || inputs.backup_stage == 'full'
        timeout-minutes: 3
        env:
          MOSA2_ISOLATED_MYSQL: '1'
        run: '"$RUNNER_TEMP/collector-db-venv/bin/python" -B -m unittest -v test_collector_persistence test_collector_persistence_mysql'
      - name: Unchanged 0005 migration, exact schema5, every interrupted step and independent synthetic readbacks
        if: (inputs.verification_scope != 'backup-restore' || inputs.backup_stage == 'full') && (inputs.verification_scope == 'migration5' || (inputs.verification_scope == 'schema5' || inputs.verification_scope == 'backup-restore'))
        timeout-minutes: 5
        env:
          MOSA2_ISOLATED_MYSQL: '1'
        run: '"$RUNNER_TEMP/collector-db-venv/bin/python" -B -m unittest -v test_migration5 test_migration5_mysql test_check_expression'
      - name: Explicit schema4 and schema5 compatibility, Current atomic readback and replay
        if: (inputs.verification_scope != 'backup-restore' || inputs.backup_stage == 'full') && ((inputs.verification_scope == 'schema5' || inputs.verification_scope == 'backup-restore'))
        timeout-minutes: 5
        env:
          MOSA2_ISOLATED_MYSQL: '1'
        run: '"$RUNNER_TEMP/collector-db-venv/bin/python" -B -m unittest -v test_schema5_compat_mysql test_schema5_release'
      - name: Unchanged historical 33-file release regressions at its qualified commit
        if: (inputs.verification_scope != 'backup-restore' || inputs.backup_stage == 'full') && ((inputs.verification_scope == 'schema5' || inputs.verification_scope == 'backup-restore'))
        timeout-minutes: 3
        run: |
          git worktree add --detach "$RUNNER_TEMP/historical-release" 6fa0655088f5ae2b37b7043b10a568d4aa2f14fb
          cd "$RUNNER_TEMP/historical-release"
          "$RUNNER_TEMP/collector-db-venv/bin/python" -B -m unittest -v test_collector_release
          "$RUNNER_TEMP/collector-db-venv/bin/python" -B scripts/collector_release.py build --commit 6fa0655088f5ae2b37b7043b10a568d4aa2f14fb --output "$RUNNER_TEMP/historical-artifact"
      - name: Separate reproducible schema5 candidate, hashes and closed dependency manifest
        if: (inputs.verification_scope != 'backup-restore' || inputs.backup_stage == 'full') && ((inputs.verification_scope == 'schema5' || inputs.verification_scope == 'backup-restore'))
        run: |
          python3 -B scripts/collector_release.py build --profile schema5 --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/schema5-candidate"
          python3 -B scripts/collector_release.py verify --profile schema5 --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/schema5-candidate"
          cat "$RUNNER_TEMP/schema5-candidate/$GITHUB_SHA.manifest.json"
      - name: Bind the synthetic backup service identity and prohibit event execution
        if: inputs.verification_scope == 'backup-restore'
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          client_version=$(docker exec "$MYSQL_CONTAINER" mysqldump --version)
          printf '%s\n' "$client_version"
          [[ "$client_version" =~ (Distrib|Ver)[[:space:]]+8\.0\. ]]
          printf 'MOSA2_MYSQL_CONTAINER=%s\n' "$MYSQL_CONTAINER" >> "$GITHUB_ENV"
          printf 'MOSA2_ISOLATED_SERVER_HOSTNAME=%s\n' "$(docker inspect --format '{{.Config.Hostname}}' "$MYSQL_CONTAINER")" >> "$GITHUB_ENV"
          printf 'MOSA2_ISOLATED_SERVER_UUID=%s\n' "$(docker exec "$MYSQL_CONTAINER" mysql --no-defaults --user=root --batch --skip-column-names -e 'SET GLOBAL event_scheduler=OFF; SET GLOBAL log_bin_trust_function_creators=ON; SELECT @@server_uuid;')" >> "$GITHUB_ENV"
      - name: Synthetic encrypted backup, independent full restore, schema5 and fresh schema4 restore
        if: inputs.verification_scope == 'backup-restore'
        timeout-minutes: 8
        env:
          MOSA2_ISOLATED_MYSQL: '1'
          MOSA2_BACKUP_RESTORE_ISOLATED: '1'
          BACKUP_STAGE: ${{ inputs.backup_stage }}
        run: |
          py="$RUNNER_TEMP/collector-db-venv/bin/python"
          case "$BACKUP_STAGE" in
            diagnosis) "$py" -B -m unittest -v test_database_backup_mysql.BackupMySQLTests.diagnose_restore_evidence ;;
            focused)
              "$py" -B -m unittest -v test_database_backup_mysql.BackupMySQLTests.test_basis_restore
              "$py" -B -m unittest -v test_database_backup_mysql.BackupMySQLTests.test_complete_backup_restore_migrate5_then_fresh_schema4_restore
              "$py" -B -c 'import sys,unittest,test_database_backup as p,test_database_backup_mysql as m; c=m.BackupMySQLTests; names=[n for n in unittest.defaultTestLoader.getTestCaseNames(c) if n not in ("test_basis_restore","test_complete_backup_restore_migrate5_then_fresh_schema4_restore")]; s=unittest.TestSuite([unittest.defaultTestLoader.loadTestsFromModule(p),unittest.TestSuite(c(n) for n in names)]); sys.exit(not unittest.TextTestRunner(verbosity=2).run(s).wasSuccessful())'
              ;;
            schema-lock) "$py" -B -m unittest -v test_database_backup_mysql.BackupMySQLTests.prove_schema_read_lock_consistency ;;
            schema-export) "$py" -B -m unittest -v test_database_backup_mysql.BackupMySQLTests.prove_schema_scoped_export ;;
            full) "$py" -B -m unittest -v test_database_backup test_database_backup_mysql ;;
            *) exit 1 ;;
          esac
      - name: Collector and budget regressions
        if: inputs.verification_scope != 'backup-restore' || inputs.backup_stage == 'full'
        timeout-minutes: 4
        run: python3 -B -m unittest -v test_collector_cycle test_collector_operation_plan test_provider_budget_plan test_market_collector_v1 test_market_live_batch test_market_runtime
      - name: Current and quote selection regressions offline only
        if: inputs.verification_scope != 'backup-restore' || inputs.backup_stage == 'full'
        timeout-minutes: 6
        run: |
          python3 -B -m unittest -v test_market_current test_current_takeover test_current_outcome test_current_reconcile test_current_preview test_current_web test_quote_selection test_observation_read
          git diff --exit-code

  backup-permissions:
    if: github.repository == 'masterxfix/MOSA-2' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.verification_scope == 'backup-permissions'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Require exact reviewed revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: One read-only permission and object metadata inspection, no locks or business data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_DB_PASSWORD: ${{ secrets.MOSA_TEST_DB_PASSWORD }}
        run: python3 -B scripts/backup_permissions_remote.py

  migration5-readonly:
    needs: persistence
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.verification_scope == 'migration5' && inputs.read_preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: One existing SELECT-only connection; PREPARE only, no writer secret or executor
        env:
          GH_TOKEN: ${{ github.token }}
          TAKEOVER_PLAN_SOURCE_RUN: '39634298612'
          RECONCILE_SOURCE_COMMIT: 84a8fdded1591ec4f06426e4b590df3d71e983c5
          RECONCILE_PLAN_SHA256: 2696fbb0584ec72b3391f73a539cbbad43356111b7cc93ea5bdc1ce117b6f524
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/collector_migration5_remote.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration5-plan-encrypted-prepare-only
          path: ${{ runner.temp }}/migration5-plan.sealed.json
          if-no-files-found: error
          retention-days: 7
