name: M2 schema7 collector four-ISIN independent coverage audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-schema7-collector-coverage-20261113-once.yml']
permissions: {contents: read}
jobs:
  audit:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'Audit four M2 market assets after cron recovery read-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Read cron and current DB age for every registered ISIN
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          import collector_actions as ssh,collector_db_locality as remote,deploy_test_sftp as profile,paramiko
          source=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)
              throw new RuntimeException('M2_READER');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);$db->exec('SET SESSION TRANSACTION READ ONLY');$db->beginTransaction();
          if((int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)
              throw new RuntimeException('READONLY');
          $current=$db->query("SELECT i.normalized_value AS isin,c.observed_at,c.market_at,
              TIMESTAMPDIFF(MINUTE,c.observed_at,UTC_TIMESTAMP()) AS age_minutes,s.source_key
              FROM m2_market_current c
              JOIN m2_asset_identifiers i ON i.asset_id=c.asset_id AND i.is_primary=1
              JOIN m2_sources s ON s.id=c.source_id
              ORDER BY i.normalized_value")->fetchAll();
          $last=$db->query("SELECT COUNT(*) AS total,MAX(observed_at) AS newest,
              SUM(observed_at>=UTC_TIMESTAMP()-INTERVAL 15 MINUTE) AS recent_15min
              FROM m2_market_observations")->fetch();
          $db->rollBack();
          echo json_encode(['readonly'=>true,'checked_utc'=>gmdate('c'),'current'=>$current,'observations'=>$last],
              JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          """
          with ssh.ssh_client(profile.configuration(),{},paramiko) as t:
              rc,cron,err,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if rc or err:raise RuntimeError('CRON_READ_FAILURE')
              entries=[x for x in cron.splitlines() if b'/scripts/market_collector/mosa_tick.php' in x and not x.lstrip().startswith(b'#')]
              expected=b'50eb855ebd0e69bc8e29353239c728d94ae9e678'
              if len(entries)!=1 or entries[0].count(expected)!=1:raise RuntimeError('M2_CRON_RELEASE_NOT_ACTIVE')
              php,_=remote.capability(t)
              rc,out,err,_=remote.remote_call(t,remote.command(php,remote.BOOTSTRAP),
                  json.dumps({'source':source}).encode(),timeout=45)
              if rc or err:raise RuntimeError('DB_QUERY_FAILED')
              state=json.loads(out)
              if not state.get('readonly') or len(state['current'])!=4:raise RuntimeError('M2_INCOMPLETE_CURRENT')
              print('M2_FOUR_ISIN_HEALTH '+json.dumps(state,ensure_ascii=False),flush=True)
          PY
