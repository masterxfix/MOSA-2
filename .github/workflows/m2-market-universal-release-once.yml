name: M2 unified ETF and stock quote module release (existing private collector)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-market-universal-release-once.yml']
permissions:
  contents: read
concurrency:
  group: mosa2-universal-market-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Deploy class-neutral stock ETF quote choice to M2 testsite'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Pre-deployment full market regression and generated-site contract
        run: |
          php -l api/market_sources.php
          php -l api/market_source_engine.php
          php tests/test_twelve_data_provider.php
          php tests/test_eodhd_provider.php
          php -l api/isin_quote.php
          php -l scripts/market_collector/mosa_tick.php
          php -l scripts/market_collector/actions_acceptance.php
          php -l scripts/market_collector/onboarding.php
          php tests/test_market_tick_sources.php
          php tests/fixtures/isin_quote_test.php
          php tests/fixtures/isin_quote_all_test.php
          php tests/test_market_registry_model.php
          php tests/test_market_batch_scope.php
          python3 -B -m unittest discover -s tests -p 'test_market_onboarding.py' -v
          python3 -B -m unittest discover -s tests -p 'test_market_selection.py' -v
          python3 -B -m unittest discover -s tests -p 'test_market_general.py' -v
          node --check assets/js/isin_quotes.js
          node tests/isin_automation_browser_check.cjs
          node tests/isin_refresh_browser_check.cjs
          node tests/isin_browser_check.cjs
          node tests/isin_details_browser_check.cjs
          python3 -B -m unittest discover -s tests -p 'test_isin_quote.py' -v
          python3 scripts/build_pages.py --check
          python3 scripts/deploy_sftp.py validate
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Install immutable M2 private collector (current cron stays untouched)
        env:
          M2_EXPECTED_COMMIT: ${{ github.sha }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/deploy_market_collector.py install
      - name: Backup and deploy only affected M2 testsite files with SHA-256 readback
        env:
          MOSA_TEST_SFTP_FILES: '["api/market_sources.php","api/market_source_engine.php"]'
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B scripts/deploy_test_sftp.py check-config
          python3 -B scripts/deploy_test_sftp.py backup
          python3 -B scripts/deploy_test_sftp.py deploy
