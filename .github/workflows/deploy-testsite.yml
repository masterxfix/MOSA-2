name: Deploy MOSA 2 testsite

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Probe (temporary file only) or deploy an explicit web file set
        type: choice
        options: [probe, deploy]
        default: probe
        required: true
      files_json:
        description: JSON array of tracked web filenames; required only for deploy
        type: string
        default: '[]'
        required: false

      expected_commit:
        description: Exact reviewed commit for deployment
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mosa-2-testsite-sftp
  cancel-in-progress: false

jobs:
  testsite:
    if: github.repository == 'masterxfix/MOSA-2' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require exact reviewed revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test SFTP profiles and target isolation
        run: python3 -m unittest discover -s tests -p 'test_deploy*.py' -v
      - name: Validate tracked web package
        run: python3 scripts/deploy_sftp.py validate
      - name: Install pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Current web and shared selection Linux regressions before upload
        env:
          PYTHONPATH: .:tests
        run: python3 -B -m unittest -v test_current_web test_market_current test_observation_read test_quote_selection test_market_view test_phase3c
      - name: Backup explicit web files before deployment
        if: inputs.operation == 'deploy'
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_SFTP_FILES: ${{ inputs.files_json }}
          TEST_OPERATION: ${{ inputs.operation }}
        run: python3 scripts/deploy_test_sftp.py backup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.operation == 'deploy'
        with:
          name: encrypted-testsite-web-backup
          path: ${{ runner.temp }}/mosa2-web-backup.sealed.json
          retention-days: 30
          if-no-files-found: error
      - name: SFTP testsite only
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_SFTP_FILES: ${{ inputs.files_json }}
          TEST_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 scripts/deploy_test_sftp.py check-config
          case "$TEST_OPERATION" in
            probe|deploy) python3 scripts/deploy_test_sftp.py "$TEST_OPERATION" ;;
            *) echo 'Unsupported operation'; exit 1 ;;
          esac
          printf 'MOSA-2 testsite SFTP: PASS\nCommit: %s\nOperation: %s\n' "$GITHUB_SHA" "$TEST_OPERATION" >> "$GITHUB_STEP_SUMMARY"
