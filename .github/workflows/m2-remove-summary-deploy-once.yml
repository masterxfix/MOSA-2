name: M2 market heading - one-time live Chrome verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m2-remove-summary-deploy-once.yml

permissions:
  contents: read

jobs:
  chrome-check:
    if: >-
      github.repository == 'masterxfix/MOSA-2' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'M2 one-time visual check: market summary removed'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Install temporary browser test dependency
        run: python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Render live M2 page in Google Chrome and capture heading only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser=playwright.chromium.launch(channel="chrome",headless=True,args=["--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1000},locale="de-DE",timezone_id="Europe/Berlin")
              response=page.goto("https://mosa2-test.scharwerk.de/marktdaten.html",wait_until="domcontentloaded",timeout=30000)
              assert response is not None and response.status==200, f"HTTP: {response.status if response else 'none'}"
              page.wait_for_function("""() => {
                const elt=document.querySelector('[data-page-load-time]');
                return elt && elt.textContent.trim()!=='— ms';
              }""",timeout=20000)
              assert page.locator("[data-isin-summary]").count()==0,"Status element still exists"
              assert page.get_by_text("Abgefragte und gespeicherte Kurse").count()==0,"Removed status visible"
              heading=page.locator(".observation-section .section-heading")
              assert heading.count()==1 and heading.is_visible(),"Heading missing"
              assert "Meine ISIN-Kursabfragen" in heading.inner_text(),"Expected heading missing"
              assert page.locator("[data-isin-count]").count()==1,"Independent ISIN counter missing"
              assert page.locator("[data-isin-table]").count()==1,"Market quotes table missing"
              latency=page.locator("[data-page-load-time]").inner_text().strip()
              body=page.locator("body")
              print("Browser: Google Chrome; page HTTP: 200")
              print("Heading rendered with redundant summary absent: PASS")
              print("ISIN counter and market table present: PASS")
              print("Load duration including market reads:",latency)
              print("Market read HTTP:",body.get_attribute("data-isin-read-http"))
              print("Market ready success:",body.get_attribute("data-data-success"))
              ms=float(latency.replace(" ms","")) if latency.endswith(" ms") else float(latency.replace(" s","").replace(",","."))*1000
              assert ms<=2000,f"Page load exceeds 2 s: {latency}"
              heading.screenshot(path="market-heading-live.png")
              print("Chrome rendered heading screenshot captured: PASS")
              browser.close()
          PY
      - name: Save restricted heading screenshot for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-market-heading-visual-proof
          path: market-heading-live.png
          retention-days: 3
          if-no-files-found: error
