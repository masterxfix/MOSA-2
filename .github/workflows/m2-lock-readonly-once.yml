name: M2 registered ISIN and live lock diagnostic (one-time read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-lock-readonly-once.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Check M2 NEL ISIN registry contention read only'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install pinned deployment SSH client
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Check exact M2 read-only credentials and NEL identity / scheduler lock
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collector_actions as ssh
          import collector_db_locality as remote
          import deploy_test_sftp as profile
          import paramiko
          source=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)
              throw new RuntimeException('m2_read_account');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);$db->exec('SET SESSION TRANSACTION READ ONLY');$db->beginTransaction();
          if($db->query('SELECT DATABASE()')->fetchColumn()!=='h29077_mosa2_test'||
              (int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)
              throw new RuntimeException('not_readonly');
          $query=$db->prepare("SELECT i.normalized_value AS isin,i.is_primary,i.valid_to,
              a.display_name,a.asset_class,a.status AS asset_status,e.status AS entity_status
              FROM m2_asset_identifiers i
              JOIN m2_assets a ON a.entity_id=i.asset_id
              JOIN m2_entities e ON e.id=a.entity_id
              WHERE i.identifier_type='isin' AND i.normalized_value=? AND i.scope_key=''");
          $query->execute(['NO0010081235']);$nel=$query->fetchAll();
          $total=(int)$db->query("SELECT COUNT(*) FROM m2_asset_identifiers WHERE identifier_type='isin' AND is_primary=1 AND valid_to IS NULL")->fetchColumn();
          $lock=$db->query("SELECT IS_USED_LOCK('m2-collector-scheduler')")->fetchColumn();
          $db->rollBack();
          echo json_encode(['checked_at_utc'=>gmdate('c'),'read_only'=>true,'m2_nel_entries'=>$nel,
                'primary_isin_count'=>$total,'scheduler_lock_held'=>$lock!==null&&$lock!==false],JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          """
          with ssh.ssh_client(profile.configuration(),{},paramiko) as transport:
              phpbin,_=remote.capability(transport)
              code,out,err,_=remote.remote_call(transport,remote.command(phpbin,remote.BOOTSTRAP),
                  json.dumps({'source':source}).encode(),timeout=40)
              if code or err:raise RuntimeError('M2_DB_READ_PROBE_FAILED')
              report=json.loads(out)
              if report.get('read_only') is not True:raise RuntimeError('NOT_READ_ONLY')
              print('M2_LOCK_PROOF '+json.dumps(report,ensure_ascii=False),flush=True)
          PY
