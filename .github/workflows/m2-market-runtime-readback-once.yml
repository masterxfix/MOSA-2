name: M2 independent market runtime evidence (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-market-runtime-readback-once.yml'
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'M2 market runtime readback 2026-11-12'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned read-only SSH dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Read provider inventory and active cron pointer without writes
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import json, re, sys
          sys.path.insert(0,'scripts')
          import collector_actions as shared
          import collector_db_locality as remote
          import deploy_test_sftp as profile
          import paramiko
          php = """
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(!is_array($cfg)||($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)throw new RuntimeException('database_target');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,PDO::ATTR_EMULATE_PREPARES=>false]);
          unset($cfg);
          if($db->query('SELECT DATABASE()')->fetchColumn()!=='h29077_mosa2_test')throw new RuntimeException('database_name');
          $db->exec('SET SESSION TRANSACTION READ ONLY');
          $db->beginTransaction();
          if((int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)throw new RuntimeException('database_readonly');
          $source=$db->query("SELECT s.source_key,s.enabled,COUNT(o.id) AS stored_observations,MAX(o.observed_at) AS last_observed_at FROM m2_sources s LEFT JOIN m2_market_observations o ON o.source_id=s.id WHERE s.source_key IN ('provider:lang_schwarz','provider:tradegate_bsx') GROUP BY s.id,s.source_key,s.enabled ORDER BY s.source_key")->fetchAll();
          $current=$db->query("SELECT s.source_key,COUNT(*) AS current_count FROM m2_market_current c JOIN m2_sources s ON s.id=c.source_id WHERE s.source_key IN ('provider:lang_schwarz','provider:tradegate_bsx') GROUP BY s.source_key")->fetchAll();
          $db->rollBack();
          echo json_encode(['read_only'=>true,'sources'=>$source,'current_by_source'=>$current],JSON_THROW_ON_ERROR);
          """
          with shared.ssh_client(profile.configuration(),{},paramiko) as transport:
              phpbin,_=remote.capability(transport)
              code,out,err,_=remote.remote_call(transport,remote.command(phpbin,remote.BOOTSTRAP),json.dumps({'source':php}).encode('utf-8'),timeout=60)
              if code!=0 or err: raise SystemExit('FAIL: read-only DB probe')
              report=json.loads(out)
              if report.get('read_only') is not True: raise SystemExit('FAIL: DB transaction not read-only')
              code,listing,err,_=remote.remote_call(transport,'/usr/bin/crontab -l',timeout=20)
              commands=listing.decode('utf-8','replace') if code==0 and not err else ''
              cron_releases=sorted(set(re.findall(r'releases/([0-9a-f]{40})/',commands)))
              cron_mention=bool(re.search(r'mosa_tick\\.php|mosa2-collector',commands))
              print(json.dumps({'read_only':True,'sources':report['sources'],'current_by_source':report['current_by_source'],
                  'cron_job_detected':cron_mention,'cron_release_shas':cron_releases,'cron_listing_available':code==0 and not err},ensure_ascii=False))
          PY
