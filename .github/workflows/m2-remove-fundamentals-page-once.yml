name: M2 remove retired fundamentals page - one-time guarded testsite release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m2-remove-fundamentals-page-once.yml

permissions:
  contents: read

concurrency:
  group: mosa-2-testsite-sftp
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'masterxfix/MOSA-2' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'M2 one-time guarded fundamentals page retirement'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed source revision and original page snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e8edf02cecc4aa9c4cab2c2ed7f4be2157d35e58
          fetch-depth: 4
          persist-credentials: false
      - name: Validate generated remaining pages and retired page absence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e8edf02cecc4aa9c4cab2c2ed7f4be2157d35e58"
          git cat-file -e "4245366922a83808896b7c3a262c3114720c9d11:fundamentaldaten.html"
          git cat-file -e "4245366922a83808896b7c3a262c3114720c9d11:assets/main-fundamentals.html"
          python3 scripts/build_pages.py --check
          node --check assets/js/navigation.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ('fundamentaldaten.html','assets/main-fundamentals.html'):
              assert not Path(name).exists(),name
          for name in ('index.html','marktdaten.html','anbieter-labor.html'):
              page=Path(name).read_text(encoding='utf-8')
              assert 'fundamentaldaten.html' not in page,name
              assert 'data-page="fundamentals"' not in page,name
              assert 'assets/js/fundamentals.js' not in page,name
              assert page.count('data-page="overview"')==1,name
              assert page.count('data-page="market"')==1,name
              assert 'href="anbieter-labor.html"' in page,name
          assert 'window.MosaFundamentals' not in Path('assets/js/navigation.js').read_text()
          assert Path('api/fundamentals.php').is_file()
          print('Deleted page and navigation, data API retained: PASS')
          PY
      - name: Install PHP 8.4 to test unchanged data reader
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Run targeted frontend and deployment regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_fundamentals_web.py' -v
          python3 -m unittest discover -s tests -p 'test_deploy*.py' -v
          node tests/isin_automation_browser_check.cjs
          python3 scripts/deploy_sftp.py validate
      - name: Install pinned SFTP library
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Encrypt backup of five active web files
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_SFTP_FILES: '["index.html","marktdaten.html","anbieter-labor.html","assets/js/navigation.js","assets/main-overview.html"]'
        run: |
          set -euo pipefail
          python3 scripts/deploy_test_sftp.py check-config
          python3 scripts/deploy_test_sftp.py backup
      - name: Retain encrypted active file rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-retire-fundamentals-active-files-backup
          path: ${{ runner.temp }}/mosa2-web-backup.sealed.json
          retention-days: 7
          if-no-files-found: error
      - name: Deploy five changed M2 web files and verify server readback
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_SFTP_FILES: '["index.html","marktdaten.html","anbieter-labor.html","assets/js/navigation.js","assets/main-overview.html"]'
        run: |
          set -euo pipefail
          python3 scripts/deploy_test_sftp.py deploy
      - name: Hash-guarded removal of only two retired M2 frontend files
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,os,stat,subprocess,sys
          sys.path.insert(0,'scripts')
          import deploy_test_sftp as testsite
          import deploy_sftp as shared
          import paramiko
          config=testsite.configuration()
          removed=('fundamentaldaten.html','assets/main-fundamentals.html')
          old_ref='4245366922a83808896b7c3a262c3114720c9d11'
          expected={name:hashlib.sha256(subprocess.check_output(['git','show',old_ref+':'+name])).hexdigest() for name in removed}
          class PinnedKey(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,client,hostname,key):
                  shared.verify_fingerprint(key.asbytes(),config['host_key_sha256'])
          with paramiko.SSHClient() as client:
              client.set_missing_host_key_policy(PinnedKey())
              client.connect(config['host'],port=22,username=config['user'],password=config['password'],
                  allow_agent=False,look_for_keys=False,timeout=20,banner_timeout=20,auth_timeout=20,
                  disabled_algorithms={'keys':['ssh-rsa','rsa-sha2-256','rsa-sha2-512',
                    'ecdsa-sha2-nistp256','ecdsa-sha2-nistp384','ecdsa-sha2-nistp521']})
              with client.open_sftp() as sftp:
                  sftp.get_channel().settimeout(30)
                  if sftp.normalize(config['path'])!=shared.TEST_ROOT:
                      raise ValueError('Unexpected remote root')
                  shared.check_remote(sftp,shared.TEST_ROOT,scoped=True)
                  before={};archive={}
                  for name in removed:
                      shared.check_remote(sftp,shared.TEST_ROOT,name,scoped=True)
                      remote=shared.TEST_ROOT+'/'+name
                      mode=shared.remote_kind(sftp,remote)
                      if mode is None:
                          before[name]=None
                          continue
                      if not stat.S_ISREG(mode):raise ValueError('Unexpected remote type: '+name)
                      with sftp.open(remote,'rb') as stream:data=stream.read(2_000_001)
                      if len(data)>2_000_000:raise ValueError('Backup limit: '+name)
                      digest=hashlib.sha256(data).hexdigest()
                      if digest!=expected[name]:raise ValueError('Unexpected remote content: '+name)
                      before[name]=digest
                      archive[name]=base64.b64encode(data).decode('ascii')
                  testsite.persist_backup(before,archive,config['password'])
                  print('Encrypted rollback and exact prior-commit SHA-256 comparison: PASS')
                  for name in removed:
                      if before[name] is not None:
                          shared.check_remote(sftp,shared.TEST_ROOT,name,scoped=True)
                          sftp.remove(shared.TEST_ROOT+'/'+name)
                      if shared.remote_kind(sftp,shared.TEST_ROOT+'/'+name) is not None:
                          raise ValueError('Removed page still present: '+name)
                      print('Absent on M2 testsite: '+name)
          PY
      - name: Retain encrypted rollback of deleted frontend files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-retire-fundamentals-deleted-files-backup
          path: ${{ runner.temp }}/mosa2-web-backup.sealed.json
          retention-days: 7
          if-no-files-found: error
      - name: Independent SFTP verification of live navigation and removed paths
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import deploy_test_sftp as site, deploy_sftp as shared, paramiko
          cfg=site.configuration()
          class Pin(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,client,hostname,key):
                  shared.verify_fingerprint(key.asbytes(),cfg['host_key_sha256'])
          active=['index.html','marktdaten.html','anbieter-labor.html','assets/js/navigation.js','assets/main-overview.html']
          removed=['fundamentaldaten.html','assets/main-fundamentals.html']
          with paramiko.SSHClient() as client:
              client.set_missing_host_key_policy(Pin())
              client.connect(cfg['host'],port=22,username=cfg['user'],password=cfg['password'],
                  allow_agent=False,look_for_keys=False,timeout=20,banner_timeout=20,auth_timeout=20,
                  disabled_algorithms={'keys':['ssh-rsa','rsa-sha2-256','rsa-sha2-512',
                    'ecdsa-sha2-nistp256','ecdsa-sha2-nistp384','ecdsa-sha2-nistp521']})
              with client.open_sftp() as sftp:
                  if sftp.normalize(cfg['path'])!=shared.TEST_ROOT:raise ValueError('Wrong root')
                  shared.check_remote(sftp,shared.TEST_ROOT,scoped=True)
                  for name in active:
                      shared.check_remote(sftp,shared.TEST_ROOT,name,scoped=True)
                      with sftp.open(shared.TEST_ROOT+'/'+name,'rb') as stream:data=stream.read(1_000_001)
                      if hashlib.sha256(data).digest()!=hashlib.sha256(Path(name).read_bytes()).digest():
                          raise ValueError('Live SHA mismatch '+name)
                      if name.endswith('.html') and b'fundamentaldaten.html' in data:
                          raise ValueError('Retired link remains '+name)
                  for name in removed:
                      shared.check_remote(sftp,shared.TEST_ROOT,name,scoped=True)
                      if shared.remote_kind(sftp,shared.TEST_ROOT+'/'+name) is not None:
                          raise ValueError('Retired file still exists '+name)
                  print('M2 testsite: 5 exact source SHA-256 readbacks, 2 paths absent, no removed links: PASS')
          PY
