name: M2 schema7 collector guarded real source and DB writer probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-schema7-collector-live-probe-20261113-once.yml']
permissions: {contents: read}
concurrency:
  group: m2-schema7-collector-rollout
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'Probe new M2 schema7 market collector with real quote readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Run only existing M2 scheduled collector binary once and read back independently
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import json,re,sys,shlex,time
          sys.path.insert(0,'scripts')
          import collector_actions as ssh,collector_db_locality as remote,deploy_market_collector as rel,deploy_test_sftp as profile,paramiko
          OLD='a82439c0ad695e30678af4ca9e34ab98abf634f2'
          NEW='50eb855ebd0e69bc8e29353239c728d94ae9e678'
          tick=rel.PERIODIC+'/releases/'+NEW+'/scripts/market_collector/mosa_tick.php'
          read_source=r"""
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
          if(($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)throw new RuntimeException('M2_READER');
          $db=new PDO($dsn,$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);$db->exec('SET SESSION TRANSACTION READ ONLY');$db->beginTransaction();
          if((int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)throw new RuntimeException('NOT_READ_ONLY');
          $obs=$db->query("SELECT COUNT(*) AS total,MAX(observed_at) AS newest,
              SUM(observed_at>=UTC_TIMESTAMP()-INTERVAL 10 MINUTE) AS last_10min
              FROM m2_market_observations")->fetch();
          $current=$db->query("SELECT i.normalized_value AS isin,s.source_key,c.observed_at,c.market_at,c.currency,c.price
              FROM m2_market_current c
              JOIN m2_asset_identifiers i ON i.asset_id=c.asset_id AND i.is_primary=1
              JOIN m2_sources s ON s.id=c.source_id
              ORDER BY c.observed_at DESC LIMIT 8")->fetchAll();
          $db->rollBack();
          echo json_encode(['readonly'=>true,'utc'=>gmdate('c'),'observations'=>$obs,'current'=>$current],JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          """
          def check(t,php):
              rc,out,err,_=remote.remote_call(t,remote.command(php,remote.BOOTSTRAP),
                   json.dumps({'source':read_source}).encode(),timeout=60)
              if rc or err:raise RuntimeError('M2_DB_READBACK_UNAVAILABLE')
              result=json.loads(out)
              if not result.get('readonly'):raise RuntimeError('M2_DB_READBACK_NOT_READ_ONLY')
              return result
          def cron(t):
              rc,out,err,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if rc or err or len(out)>32768:raise RuntimeError('CRON_NOT_READABLE')
              ticks=[x for x in out.splitlines() if b'/scripts/market_collector/mosa_tick.php' in x and not x.lstrip().startswith(b'#')]
              if len(ticks)!=1 or ticks[0].count(OLD.encode())!=1:raise RuntimeError('CRON_ALREADY_CHANGED')
          with ssh.ssh_client(profile.configuration(),{},paramiko) as t:
              cron(t)
              php,_=remote.capability(t)
              before=check(t,php)
              report=None
              for attempt in range(6):
                  rc,out,err,_=remote.remote_call(t,shlex.join([php,tick]),timeout=160)
                  if rc or err:
                      if err:print('M2_COLLECTOR_RUNTIME_CODE '+err.decode('utf-8','replace').strip()[:300],flush=True)
                      raise RuntimeError('NEW_M2_PRIVATE_COLLECTOR_EXEC_FAILED')
                  if out.strip():
                      try:report=json.loads(out)
                      except (ValueError,UnicodeDecodeError):raise RuntimeError('NEW_M2_COLLECTOR_INVALID_JSON')
                      break
                  time.sleep(7)
              if not isinstance(report,dict) or report.get('registered')!=4 or report.get('due')!=2:
                  raise RuntimeError('NEW_M2_COLLECTOR_NO_QUALIFIED_RUN')
              items=report.get('items',{})
              if not isinstance(items,dict) or len(items)!=2:
                  raise RuntimeError('M2_COLLECTOR_ITEM_CARDINALITY')
              summary={k:{field:v.get(field) for field in ('provider','writer','readback','quote','failure','identity') if field in v}
                       for k,v in items.items() if isinstance(v,dict)}
              after=check(t,php)
              print('M2_COLLECTOR_REAL_PROBE '+json.dumps({'release':NEW,'http':report.get('provider_requests'),
                  'items':summary,'before':before['observations'],'after':after['observations'],
                  'current':after['current']},ensure_ascii=False),flush=True)
              if any(not isinstance(v,dict) or v.get('failure') for v in items.values()):
                  raise RuntimeError('M2_COLLECTOR_FAILED_INDIVIDUAL_ASSET')
              good=[v for v in items.values() if v.get('readback')=='PASS' or v.get('writer')=='UNCHANGED']
              if not good:raise RuntimeError('M2_COLLECTOR_NO_VALIDATED_WRITER')
              if int(after['observations']['total'])<=int(before['observations']['total']):
                  raise RuntimeError('M2_COLLECTOR_NO_NEW_OBSERVATIONS')
              if str(after['observations']['newest'])<=str(before['observations']['newest']):
                  raise RuntimeError('M2_COLLECTOR_LATEST_NOT_ADVANCED')
              cron(t)
              print('PASS M2_REAL_QUOTE_WRITER_AND_INDEPENDENT_DB_READBACK old_cron_still_active=true',flush=True)
          PY
