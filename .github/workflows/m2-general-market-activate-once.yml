name: M2 unified market activation and readback (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-general-market-activate-once.yml']
permissions:
  contents: read
concurrency:
  group: mosa2-unified-market-rollout
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Activate general M2 market module 2026-11-12'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Source regression
        run: |
          php -l scripts/market_collector/mosa_tick.php
          php tests/test_market_tick_sources.php
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Verify M2-only release, switch existing cron and prove one real collection
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,shlex,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collector_actions as ssh
          import collector_db_locality as remote
          import deploy_market_collector as release
          import deploy_test_sftp as profile
          import deploy_sftp as web
          import paramiko

          OLD='4d35f3e1a3abe8d0266f602d9909f3a495fa2684'
          NEW='397a188585ec5372b316234e1342e3e5ed5b01f8'
          path=release.PERIODIC+'/releases/'+NEW+'/scripts/market_collector/mosa_tick.php'
          files=['api/market_source_engine.php','api/market_sources.php','api/isin_quote.php']
          def remote_cron(t):
              code,out,errors,_=remote.remote_call(t,'/usr/bin/crontab -l',timeout=25)
              if code!=0 or errors or not out or len(out)>32768: raise RuntimeError('CRON_READ_FAILED')
              return out
          def replace_cron(t,data):
              code,out,errors,_=remote.remote_call(t,'/usr/bin/crontab -',data,timeout=25)
              if code!=0 or errors: raise RuntimeError('CRON_WRITE_FAILED')
          with ssh.ssh_client(profile.configuration(),{},paramiko) as transport:
              with paramiko.SFTPClient.from_transport(transport) as sftp:
                  targets=[(path,Path('scripts/market_collector/mosa_tick.php').read_bytes())]
                  targets.extend((web.TEST_ROOT+'/'+f,Path(f).read_bytes()) for f in files)
                  for target,expected in targets:
                      with sftp.open(target,'rb') as handle:
                          actual=handle.read(len(expected)+1)
                      if actual!=expected: raise RuntimeError('EXACT_RELEASE_OR_WEB_FILE_DRIFT')
              old=remote_cron(transport)
              rows=old.splitlines(keepends=True)
              matches=[i for i,line in enumerate(rows) if b'/scripts/market_collector/mosa_tick.php' in line and not line.lstrip().startswith(b'#')]
              if len(matches)!=1 or rows[matches[0]].count(OLD.encode())!=1 or NEW.encode() in old:
                  raise RuntimeError('CRON_SCOPE_DRIFT')
              rows[matches[0]]=rows[matches[0]].replace(OLD.encode(),NEW.encode(),1)
              updated=b''.join(rows)
              replace_cron(transport,updated)
              if remote_cron(transport)!=updated:
                  replace_cron(transport,old)
                  if remote_cron(transport)!=old: raise RuntimeError('CRON_RESTORE_FAILED')
                  raise RuntimeError('CRON_READBACK_FAILED')
              print('PASS: existing single M2 cron points to pinned unified collector '+NEW,flush=True)
              phpbin,_=remote.capability(transport)
              result_code,output,errors,_=remote.remote_call(transport,shlex.join([phpbin,path]),timeout=180)
              if result_code!=0 or errors or not output:
                  raise RuntimeError('M2_LIVE_COLLECTOR_FAILED')
              try: report=json.loads(output)
              except (ValueError,UnicodeDecodeError): raise RuntimeError('M2_LIVE_OUTPUT_INVALID')
              due=report.get('due',0)
              items=report.get('items',{})
              if not isinstance(due,int) or due<1 or not isinstance(items,dict) or not items:
                  raise RuntimeError('M2_NO_LIVE_ASSET_PROCESSED')
              if any(not isinstance(r,dict) or 'failure' in r or 'readback' not in r and r.get('writer')!='UNCHANGED'
                     for r in items.values()):
                  raise RuntimeError('M2_ITEM_READBACK_FAILED')
              requests=report.get('provider_requests',[])
              providers=[{'key':v.get('key'),'status':v.get('status')} for v in requests
                         if v.get('key') in ['lang_schwarz_search','lang_schwarz_page','tradegate_quote','tradegate_trade','boerse_frankfurt_trade']]
              print(json.dumps({'live_run':'PASS','registered':report['registered'],'due':due,
                  'requests':providers,'writers':[v.get('writer') for v in items.values()],
                  'readbacks':[v.get('readback') for v in items.values()],'unavailable':len(report.get('unavailable',[]))}),flush=True)
              # Independent, strictly read-only M2 DB source/Current reconciliation.
              phpcode="""
              $file='/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
              $cfg=require $file;
              $dsn='mysql:host=127.0.0.1;port=3307;dbname=h29077_mosa2_test;charset=utf8mb4';
              if(!is_array($cfg)||($cfg['user']??null)!=='h29077_mosa2_read'||($cfg['dsn']??null)!==$dsn)throw new RuntimeException('read_identity');
              $db=new PDO($dsn,$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
              unset($cfg);
              $db->exec('SET SESSION TRANSACTION READ ONLY');
              $db->beginTransaction();
              if($db->query('SELECT DATABASE()')->fetchColumn()!=='h29077_mosa2_test'
                  ||(int)$db->query('SELECT @@session.transaction_read_only')->fetchColumn()!==1)throw new RuntimeException('read_only');
              $sources=$db->query("SELECT s.source_key,s.enabled,COUNT(o.id) AS observations,MAX(o.observed_at) AS latest
                  FROM m2_sources s LEFT JOIN m2_market_observations o ON o.source_id=s.id
                  WHERE s.source_key IN ('provider:lang_schwarz','provider:tradegate_bsx','provider:boerse_frankfurt_api')
                  GROUP BY s.id,s.source_key,s.enabled ORDER BY s.source_key")->fetchAll();
              $current=$db->query("SELECT COUNT(*) FROM m2_market_current")->fetchColumn();
              $db->rollBack();
              echo json_encode(['read_only'=>true,'sources'=>$sources,'current_count'=>(int)$current],JSON_THROW_ON_ERROR);
              """
              code,out,errors,_=remote.remote_call(transport,remote.command(phpbin,remote.BOOTSTRAP),
                                                     json.dumps({'source':phpcode}).encode(),timeout=40)
              if code!=0 or errors: raise RuntimeError('M2_READBACK_PROCESS_FAILED')
              inventory=json.loads(out)
              if inventory.get('read_only') is not True or inventory.get('current_count',0)<1:
                  raise RuntimeError('M2_READBACK_INCOMPLETE')
              print(json.dumps({'independent_M2_DB_readback':'PASS','data':inventory},ensure_ascii=False),flush=True)
          PY
