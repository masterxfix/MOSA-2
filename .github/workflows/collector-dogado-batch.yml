name: Manual MOSA 2 Dogado equity batch (one three-stock grant)
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      selection_json:
        description: Ordered JSON array of 1 to 10 previously qualified equity ISINs
        required: true
        type: string
      run_id:
        description: Unique private run label, lowercase letters digits hyphens
        required: true
        type: string
      authorization:
        description: Exact one-shot three-equity authorization and full commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mosa-2-collector-live-test
  cancel-in-progress: false
jobs:
  offline:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          EXPECTED: ${{ inputs.expected_commit }}
        run: test "$EXPECTED" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git fetch --depth=1 origin 92274a79550b8acd719434459022da6de5261d2e
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Validate exact three-equity authorization before accessing any secret
        env:
          MOSA_BATCH_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MOSA_BATCH_SELECTION: ${{ inputs.selection_json }}
          MOSA_BATCH_RUN_ID: ${{ inputs.run_id }}
          MOSA_BATCH_AUTHORIZATION: ${{ inputs.authorization }}
        run: python3 -B -c 'import os; from scripts.collector_dogado_batch import scope; scope(os.environ)'
      - env:
          PYTHONPATH: '.:tests'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_collector_dogado_pne test_collector_dogado_pne_diagnose test_market_live_batch test_market_runtime.RuntimeTests.test_insert_and_duplicate_use_exact_same_observation_and_readback test_market_runtime.RuntimeTests.test_runtime_writes_only_observations test_market_runtime.RuntimeTests.test_provider_and_drift_fail_before_commit test_market_runtime.RuntimeTests.test_failed_replay_rolls_back_insert_and_independently_proves_rollback test_market_runtime.RuntimeTests.test_readback_failure_retains_committed_observation test_market_runtime.RuntimeTests.test_ledger_unit_and_identity_drift_rejected_before_provider test_market_runtime.RuntimeTests.test_old_route_group_conflicts_and_acquisition_mismatch_fail_closed test_market_runtime.RuntimeTests.test_corrupt_duplicate_payload_fails_closed
  live:
    # Exact one-shot grant only; fixed remote directory prevents reuse across commits.
    if: github.repository == 'masterxfix/MOSA-2' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha && inputs.run_id == 'three-equities-20261021-01' && inputs.selection_json == '["DE000A0JBPG2","DE0005313704","AU000000DRO2"]' && inputs.authorization == format('MOSA2-DOGADO-THREE-20261021-01:{0}:three-equities-20261021-01:1fbae8bd949490a5866efad170ca7b8bd16e26f7cd35823c810b6a8b8e510c84', github.sha)
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git fetch --depth=1 origin 92274a79550b8acd719434459022da6de5261d2e
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Prepared generic supervisor; independently locked in both source layers
        env:
          MOSA_BATCH_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MOSA_BATCH_SELECTION: ${{ inputs.selection_json }}
          MOSA_BATCH_RUN_ID: ${{ inputs.run_id }}
          MOSA_BATCH_AUTHORIZATION: ${{ inputs.authorization }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_DB_PASSWORD: ${{ secrets.MOSA_TEST_DB_PASSWORD }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m scripts.collector_dogado_batch
