name: M2 identity source evidence (one-time read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-identity-readonly-probe-once.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Inspect M2 identity sources without writes'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Direct M2 read-only registered ISIN identity evidence
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collector_actions as ssh
          import collector_db_locality as remote
          import deploy_test_sftp as profile
          import paramiko
          prefix='/var/www/vhosts/web213.server10.configcenter.info/private/mosa2-collector/periodic/releases/da145dbdfdb4c21ef933e3094163eecc982f0080/'
          source=r"""
          require '<RELEASE>api/market_source_engine.php';
          require '<RELEASE>api/isin_quote.php';
          $cfg=require '/var/www/vhosts/web213.server10.configcenter.info/mosa2-market-read-private/access.php';
          if(($cfg['user']??null)!=='h29077_mosa2_read')throw new RuntimeException('read_account');
          $db=new PDO($cfg['dsn'],$cfg['user'],$cfg['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          unset($cfg);$db->exec('SET SESSION TRANSACTION READ ONLY');$db->beginTransaction();
          $assets=$db->query("SELECT i.normalized_value AS isin,a.display_name,a.asset_class
              FROM m2_asset_identifiers i JOIN m2_assets a ON a.entity_id=i.asset_id
              WHERE i.identifier_type='isin' AND i.is_primary=1 AND i.scope_key='' AND i.valid_to IS NULL
              ORDER BY i.normalized_value LIMIT 8")->fetchAll();
          $db->rollBack();$db=null;
          $rows=[];
          foreach($assets as $asset){
              $isin=$asset['isin'];
              $request=fixlabMosaMarketSourceLabLsRequest('lang_schwarz_search','L&S','/_rpc/json/.lstc/instrument/search/main',['q'=>$isin,'localeId'=>2]);
              $answer=fixlabMosaMarketSourceLabLiveTransport($request);
              $json=json_decode((string)($answer['body']??''),true);
              $search=fixlabMosaMarketSourceLabRows($json);
              $typed=fixlabMosaMarketSourceLabClassifyInstruments($search,$isin,new DateTimeImmutable('now',new DateTimeZone('UTC')));
              $entry=fixlabMosaMarketSourceLabInstrument($search,$isin);
              $lsName=is_array($entry)?fixlabMosaMarketSourceLabFirstText($entry['row'],['name','displayName','displayname','instrumentName','securityName','nameLong','nameShort','label']):null;
              $trade=fixlabMosaMarketSourceLabTradegateRequest('tradegate_quote','Tradegate','/orderbuch.php',$isin);
              $t=fixlabMosaMarketSourceLabLiveTransport($trade);
              $html=(string)($t['body']??'');
              $tgIsin=fixlabMosaMarketSourceLabTradegateColumn($html,'ISIN');
              $table=\Mosa2\IsinQuote\rows($html);
              $tgName=\Mosa2\IsinQuote\column($table,'Name');
              if($tgName===null&&preg_match_all('~<h[12]\\b[^>]*>(.*?)</h[12]>~si',$html,$titles)){
                  foreach($titles[1] as $heading){
                      $candidate=\Mosa2\IsinQuote\tdText($heading);
                      if($candidate!==''&&strlen($candidate)<=160&&!preg_match('/^(Tradegate.*|Kurssuche|Aktien|Information)$/ui',$candidate)){$tgName=$candidate;break;}
                  }
              }
              $rows[]=['isin'=>$isin,'db_name'=>$asset['display_name'],'db_class'=>$asset['asset_class'],
                  'ls_http'=>$answer['http_status']??null,'ls_match'=>$entry!==null,'ls_name'=>$lsName,
                  'ls_type'=>$typed['instrument_type'],'ls_class_source'=>$typed['instrument_type_source'],
                  'tradegate_http'=>$t['http_status']??null,'tg_isin_match'=>$tgIsin===$isin,'tg_name'=>$tgName];
          }
          echo json_encode($rows,JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          """.replace('<RELEASE>',prefix)
          with ssh.ssh_client(profile.configuration(),{},paramiko) as transport:
              phpbin,_=remote.capability(transport)
              rc,out,err,_=remote.remote_call(transport,remote.command(phpbin,remote.BOOTSTRAP),json.dumps({'source':source}).encode(),timeout=90)
              if rc or err:raise RuntimeError('IDENTITY_READ_PROBE_FAILED')
              print('M2_IDENTITIES '+out.decode().strip(),flush=True)
          PY
