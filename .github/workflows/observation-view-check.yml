name: Manual Current preview verification

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        type: string
        required: true
      read_inventory:
        description: One existing SELECT-only Dogado inventory after offline tests
        type: boolean
        default: false

      takeover_mode:
        description: Preparation only unless explicit plan-bound authorization is supplied
        type: choice
        options: [NONE, PREPARE, APPLY, RECONCILE]
        default: NONE
      recipient_public_key:
        description: Public RSA recipient DER in base64; never a private key
        type: string
      plan_source_run:
        description: Successful PREPARE run containing the encrypted plan
        type: string
      authorization:
        description: Exact plan-bound EXECUTE_CURRENT_ONCE phrase, including disabled-route permission
        type: string
      plan_source_commit:
        description: Immutable source revision of historical plan for READ ONLY reconciliation
        type: string
      plan_sha256:
        description: Expected digest of historical plan for READ ONLY reconciliation
        type: string


permissions:
  contents: read
  actions: read

concurrency:
  group: mosa2-current-once
  cancel-in-progress: false

jobs:
  offline:
    if: github.repository == 'masterxfix/MOSA-2' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:tests
    steps:
      - name: Require exact reviewed revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Existing pinned SSH client
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Current, Observations, Quote Selection and preview offline tests
        run: |
          php -l scripts/market_current/preview_read.php
          php -l scripts/market_current/read_bundle.php
          php -l tests/fixtures/current_preview.php
          python3 -B -m unittest -v test_market_current test_observation_read test_quote_selection test_current_preview test_current_takeover test_current_reconcile
          git diff --exit-code
      - name: One fileless SELECT-only inventory; public output excludes private values
        if: inputs.read_inventory && inputs.takeover_mode == 'NONE'
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/current_preview_remote.py
      - name: Claim an explicitly requested execution attempt, before any database connection
        if: inputs.takeover_mode == 'APPLY'
        run: python3 -c "import os,pathlib;pathlib.Path(os.environ['RUNNER_TEMP'],'current-takeover-claim.txt').write_text('ONE_ATTEMPT_NO_RETRY')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.takeover_mode == 'APPLY'
        with:
          name: current-takeover-consumed-${{ inputs.plan_source_run }}
          path: ${{ runner.temp }}/current-takeover-claim.txt
          retention-days: 7
          if-no-files-found: error
      - name: Prepare exact pending plan or explicitly authorize the existing Current writer
        if: inputs.takeover_mode == 'PREPARE' || inputs.takeover_mode == 'APPLY'
        env:
          TAKEOVER_MODE: ${{ inputs.takeover_mode }}
          TAKEOVER_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          TAKEOVER_PLAN_SOURCE_RUN: ${{ inputs.plan_source_run }}
          TAKEOVER_AUTHORIZATION: ${{ inputs.authorization }}
          GH_TOKEN: ${{ github.token }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_DB_PASSWORD: ${{ secrets.MOSA_TEST_DB_PASSWORD }}
        run: python3 -B scripts/current_takeover_remote.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.takeover_mode == 'PREPARE'
        with:
          name: current-takeover-sealed-plan
          path: ${{ runner.temp }}/current-takeover-plan.sealed.json
          retention-days: 7
          if-no-files-found: error
      - name: One READ ONLY comparison with original encrypted plan; never APPLY
        if: inputs.takeover_mode == 'RECONCILE'
        env:
          TAKEOVER_PLAN_SOURCE_RUN: ${{ inputs.plan_source_run }}
          RECONCILE_SOURCE_COMMIT: ${{ inputs.plan_source_commit }}
          RECONCILE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          GH_TOKEN: ${{ github.token }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: python3 -B scripts/current_reconcile_remote.py
