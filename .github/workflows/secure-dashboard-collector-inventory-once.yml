name: Secure Dashboard collectors owner requested full stop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/secure-dashboard-collector-inventory-once.yml']
permissions: {contents: read}
concurrency:
  group: securedashboard-collector-owner-pause
  cancel-in-progress: false
jobs:
  stop:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Stop all Secure Dashboard PHP collectors on Dogado, preserving original files'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Private backups, disable exactly all Secure Dashboard collector scripts, verify hashes and independent HTTP response
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,re,stat,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path.insert(0,'scripts')
          import collector_actions as remote,collector_db_locality as call,deploy_test_sftp as cfg
          import paramiko
          vhost='/var/www/vhosts/web213.server10.configcenter.info'
          root=vhost+'/httpdocs/scharwerk.de/securedashboard'
          folder=root+'/php'
          marker='SECUREDASHBOARD_ALL_COLLECTORS_DISABLED_BY_OWNER_20261113'
          gate=(
            '\n/* '+marker+' */\n'
            'if (PHP_SAPI !== "cli") {\n'
            '    http_response_code(503);\n'
            '    if (!headers_sent()) header("Content-Type: application/json; charset=utf-8");\n'
            '}\n'
            'echo \'{"ok":false,"status":"disabled_by_owner"}\\n\';\n'
            'exit;\n'
          ).encode('utf-8')
          def digest(b):return hashlib.sha256(b).hexdigest()
          def read_remote(sftp,path,limit=140000):
              st=sftp.lstat(path)
              if not stat.S_ISREG(st.st_mode) or st.st_size<100 or st.st_size>limit:
                  raise RuntimeError('COLLECTOR_NOT_REGULAR_OR_BOUNDS:'+path.rsplit('/',1)[-1])
              with sftp.open(path,'rb') as f: data=f.read(limit+1)
              if len(data)!=st.st_size:raise RuntimeError('FILE_READ_SIZE_MISMATCH')
              return data
          def patched(original,name):
              if not original.startswith(b'<?php') or b'\\0' in original:
                  raise RuntimeError('UNSUPPORTED_PHP_OPEN_TAG:'+name)
              if marker.encode() in original:raise RuntimeError('ALREADY_DISABLED:'+name)
              if re.search(rb'(?m)^\s*namespace\s+',original[:6000]):
                  raise RuntimeError('NAMESPACED_COLLECTOR_NEEDS_SEPARATE_GATE:'+name)
              d=re.search(rb'declare\s*\(\s*strict_types\s*=\s*1\s*\)\s*;',original[:3000])
              at=d.end() if d else len(b'<?php')
              return original[:at]+gate+original[at:]
          with remote.ssh_client(cfg.configuration(),{},paramiko) as ssh:
              rc,cron,err,_=call.remote_call(ssh,'/usr/bin/crontab -l',timeout=25)
              if rc or err:raise RuntimeError('CRON_READ_FAILED')
              active=[line for line in cron.splitlines() if line.strip() and not line.lstrip().startswith(b'#')]
              if any(re.search(rb'(?i)(?:secure.?dashboard|collector_[\w-]+\.php)',x) for x in active):
                  raise RuntimeError('UNEXPECTED_SECURE_DASHBOARD_CRON_MUST_INSPECT_FIRST')
              with paramiko.SFTPClient.from_transport(ssh) as sf:
                  files=sorted(x.filename for x in sf.listdir_attr(folder)
                      if re.fullmatch(r'collector_[A-Za-z0-9_&-]+\.php',x.filename))
                  if len(files)!=30 or 'collector_runner.php' not in files or 'collector_nel.php' not in files:
                      raise RuntimeError('COLLECTOR_SCOPE_CHANGED_ABORT:'+str(len(files)))
                  originals={name:read_remote(sf,folder+'/'+name) for name in files}
                  rendered={name:patched(raw,name) for name,raw in originals.items()}
                  for name,data in rendered.items():
                      with tempfile.NamedTemporaryFile(prefix='sd-gate-',suffix='.php') as tmp:
                          tmp.write(data);tmp.flush()
                          check=subprocess.run(['php','-l',tmp.name],capture_output=True,text=True,timeout=12)
                          if check.returncode!=0:raise RuntimeError('LOCAL_PHP_LINT_FAILED:'+name+':'+check.stderr[:200])
                  # All 30 originals are written once to a private non-web root
                  # before a single production PHP file is modified.
                  backup=vhost+'/securedashboard-collector-owner-stop-backup'
                  try:
                      st=sf.lstat(backup)
                      if not stat.S_ISDIR(st.st_mode) or stat.S_IMODE(st.st_mode)!=0o700:
                          raise RuntimeError('BACKUP_ROOT_UNSAFE')
                  except FileNotFoundError:
                      sf.mkdir(backup,mode=0o700);sf.chmod(backup,0o700)
                  token='pause-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+digest(b''.join(originals.values()))[:10]
                  dest=backup+'/'+token
                  sf.mkdir(dest,mode=0o700);sf.chmod(dest,0o700)
                  for name,data in originals.items():
                      p=dest+'/'+name
                      with sf.open(p,'wb') as f:f.write(data);f.flush()
                      sf.chmod(p,0o600)
                      if digest(read_remote(sf,p))!=digest(data):
                          raise RuntimeError('PRIVATE_BACKUP_READBACK_FAILED:'+name)
                  manifest={'purpose':'original Secure Dashboard PHP collector files before user requested stop',
                       'file_count':len(files),'files':{n:{'original_sha256':digest(d),'size':len(d)} for n,d in originals.items()},
                       'created_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
                  with sf.open(dest+'/manifest.json','wb') as f:f.write(json.dumps(manifest,sort_keys=True,indent=2).encode())
                  sf.chmod(dest+'/manifest.json',0o600)
                  print('PASS PRIVATE_BACKUP_ALL_30 VERIFIED file_count='+str(len(files)),flush=True)
                  # Stop runner first; then every direct single-collector HTTP/CLI entry.
                  order=['collector_runner.php']+[x for x in files if x!='collector_runner.php']
                  stopped=[]
                  for name in order:
                      path=folder+'/'+name
                      if read_remote(sf,path)!=originals[name]:
                          raise RuntimeError('REMOTE_COLLECTOR_CHANGED_DURING_STOP:'+name)
                      # Atomic replacement with an on-directory temporary file.
                      tmp=path+'.stop-tmp'
                      try:sf.lstat(tmp);raise RuntimeError('TEMP_PATH_ALREADY_EXISTS')
                      except FileNotFoundError:pass
                      with sf.open(tmp,'wb') as f:f.write(rendered[name]);f.flush()
                      sf.chmod(tmp,stat.S_IMODE(sf.lstat(path).st_mode))
                      if read_remote(sf,tmp)!=rendered[name]:
                          raise RuntimeError('TEMP_CONTENT_READBACK_INVALID:'+name)
                      try:
                          sf.posix_rename(tmp,path)
                      except IOError as ex:
                          # Do not leave an overwritten/unverified script:
                          # unavailable atomic rename must stop the deployment.
                          raise RuntimeError('ATOMIC_REPLACE_UNSUPPORTED_OR_FAILED:'+name) from ex
                      if read_remote(sf,path)!=rendered[name]:
                          raise RuntimeError('STOPPED_FILE_READBACK_INVALID:'+name)
                      stopped.append(name)
                  rc,after,err,_=call.remote_call(ssh,'/usr/bin/crontab -l',timeout=25)
                  if rc or cron!=after:raise RuntimeError('OTHER_SCHEDULES_CHANGED_DURING_STOP')
                  print('PASS ALL_SECUREDASHBOARD_COLLECTORS_STOPPED count='+str(len(stopped)),
                        'runner_first=true','cron_unchanged=true',
                        'backup_sha256='+digest(json.dumps(manifest,sort_keys=True).encode())[:16],flush=True)
                  print('STOPPED_NAMES',','.join(stopped),flush=True)
          # Independent HTTP smoke test: these are guaranteed to hit disabled
          # entrypoints and must never invoke an external market request.
          for name in ('collector_runner.php','collector_nel.php','collector_btc.php','collector_nasdaq.php'):
              url='https://scharwerk.de/securedashboard/php/'+name
              request=urllib.request.Request(url,headers={'User-Agent':'MOSA-SD-Owner-Stop-Proof/1.0','Cache-Control':'no-cache'})
              try:
                  response=urllib.request.urlopen(request,timeout=18)
                  code=response.status;body=response.read(1500)
              except urllib.error.HTTPError as ex:
                  code=ex.code;body=ex.read(1500)
              except Exception as ex:
                  print('HTTP_PROBE_NOT_REACHABLE',name,type(ex).__name__,flush=True)
                  continue
              if code==503 and b'disabled_by_owner' in body:
                  print('HTTP_STOP_CONFIRMED',name,503,flush=True)
              elif code in (401,403):
                  print('HTTP_STOP_BLOCKED_AT_WEBSERVER',name,code,flush=True)
              else:
                  raise RuntimeError('HTTP_ENDPOINT_NOT_CONFIRMED_STOPPED:'+name+':'+str(code))
          PY