name: M2 countdown-free market view testsite release (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-countdown-text-deploy-once.yml']
permissions: {contents: read}
concurrency:
  group: mosa2-universal-market-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Deploy M2 countdown-free market page to testsite once'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify generated page, preserved 30-second schedule and exact scope
        run: |
          set -euo pipefail
          python3 scripts/build_pages.py --check
          python3 scripts/deploy_sftp.py validate
          python3 - <<'PY'
          from pathlib import Path
          page=Path('marktdaten.html').read_text()
          fragment=Path('assets/main-market.html').read_text()
          js=Path('assets/js/isin_quotes.js').read_text()
          assert 'data-isin-next-check' not in page and 'data-isin-next-check' not in fragment
          assert 'const READ_INTERVAL=30000;' in js
          assert 'Im aktiven Tab prüft die Ansicht alle 30 Sekunden' in page
          print('Countdown DOM removed, existing 30-second read preserved: PASS')
          PY
      - name: Check existing reader and SFTP deployment regression
        run: |
          set -euo pipefail
          node tests/isin_automation_browser_check.cjs
          python3 -B -m unittest discover -s tests -p 'test_deploy*.py' -v
      - name: Install existing pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Encrypted backup, deploy exactly one HTML file, and SHA-256 readback
        env:
          MOSA_TEST_SFTP_FILES: '["marktdaten.html"]'
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          python3 -B scripts/deploy_test_sftp.py check-config
          python3 -B scripts/deploy_test_sftp.py backup
          python3 -B scripts/deploy_test_sftp.py deploy
      - name: Preserve encrypted predeployment backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-testsite-web-backup
          path: ${{ runner.temp }}/mosa2-web-backup.sealed.json
          retention-days: 30
          if-no-files-found: error
