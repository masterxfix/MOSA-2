name: M2 international licensed ISIN adapter offline safety regression (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-international-adapter-test-once.yml']
permissions: {contents: read}
jobs:
  test:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Test offline licensed international ISIN adapter integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with: {php-version: '8.4', extensions: pdo_mysql, coverage: none}
      - name: Run fully offline international provider, all old source and writer contract tests
        run: |
          php -l api/market_core/twelve_data.php
          php -l api/market_sources.php
          php -l api/isin_quote.php
          php -l scripts/market_collector/mosa_tick.php
          php -l scripts/market_collector/actions_acceptance.php
          php tests/test_twelve_data_provider.php
          php tests/test_market_tick_sources.php
          php tests/test_m2_native_quote_route.php
          php tests/test_market_registry_model.php
          php tests/fixtures/isin_quote_all_test.php
          php tests/test_market_batch_scope.php
          node --check assets/js/isin_quotes.js
          node tests/isin_automation_browser_check.cjs
          python3 -B -m unittest discover -s tests -p 'test_isin_quote.py' -v
          python3 -B -m unittest discover -s tests -p 'test_market_onboarding.py' -v
          python3 scripts/build_pages.py --check
          python3 -B -m unittest discover -s tests -p 'test_deploy*.py' -v
