name: Deploy MOSA 2

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact explicitly authorized production commit
        type: string
        required: true
      authorization:
        description: Explicit user authorization DEPLOY_PRODUCTION:<full commit>
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mosa-2-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate web project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require explicit production authorization and exact commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$AUTHORIZATION" = "DEPLOY_PRODUCTION:$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Test deployment safety
        run: python3 -m unittest discover -s tests -v
      - name: Validate deployable web files
        run: python3 scripts/deploy_sftp.py validate
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      # Add PHP lint, MOSA tests and pre-deployment Playwright checks here.

  deploy:
    name: Deploy to mosa.scharwerk.de
    needs: validate
    if: github.repository == 'masterxfix/MOSA-2' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.expected_commit == github.sha && inputs.authorization == format('DEPLOY_PRODUCTION:{0}', github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check all secrets before connecting, then deploy
        env:
          MOSA_DEPLOY_HOST: ${{ secrets.MOSA_DEPLOY_HOST }}
          MOSA_DEPLOY_PORT: ${{ secrets.MOSA_DEPLOY_PORT }}
          MOSA_DEPLOY_USER: ${{ secrets.MOSA_DEPLOY_USER }}
          MOSA_DEPLOY_PASSWORD: ${{ secrets.MOSA_DEPLOY_PASSWORD }}
          MOSA_DEPLOY_PATH: ${{ secrets.MOSA_DEPLOY_PATH }}
          MOSA_DEPLOY_HOST_KEY_SHA256: ${{ secrets.MOSA_DEPLOY_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          python3 scripts/deploy_sftp.py check-config
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
          python3 scripts/deploy_sftp.py deploy
          printf 'Deployed commit: %s\nTarget: https://mosa.scharwerk.de\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Future independent job: verify-live, needs: deploy, no deployment secrets.
  # Check HTTPS 200, run Playwright, capture screenshot and upload its artifact.
