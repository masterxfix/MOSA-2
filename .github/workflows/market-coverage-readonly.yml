name: Issue 61 - read-only MOSA 2 reset inventory

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        type: string
        required: true
      scope:
        type: string
        required: true
      authorization:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: mosa2-issue61-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/codex/issue-61-controlled-reset' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.scope == 'issue61-inventory' && inputs.expected_commit == github.sha && inputs.authorization == format('MOSA2-ISSUE61-INVENTORY:{0}', github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - run: python3 -m pip install --disable-pip-version-check --no-input -r scripts/requirements-deploy.txt
      - name: Prove live identity, schema and writer inventory without data or secret output
        env:
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_DB_PASSWORD: ${{ secrets.MOSA_TEST_DB_PASSWORD }}
        run: |
          php -l scripts/issue61_inventory.php
          python3 -B scripts/issue61_inventory.py
  backup:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/codex/issue-61-controlled-reset' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.scope == 'issue61-backup' && inputs.expected_commit == github.sha && inputs.authorization == format('MOSA2-ISSUE61-BACKUP:{0}', github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - run: |
          python3 -m pip install --disable-pip-version-check --no-input -r scripts/requirements-deploy.txt PyMySQL==1.1.2
          docker pull mysql:8.0.46
      - name: Export under a target-only read lock and verify private recovery
        env:
          PYTHONPATH: .:scripts
          ISSUE61_BACKUP_AUTH: ${{ inputs.authorization }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_DB_PASSWORD: ${{ secrets.MOSA_TEST_DB_PASSWORD }}
          MOSA2_ISSUE61_BACKUP_RECOVERY_KEY: ${{ secrets.MOSA2_ISSUE61_BACKUP_RECOVERY_KEY }}
        run: python3 -B -m scripts.issue61_backup
