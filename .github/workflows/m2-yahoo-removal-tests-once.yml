name: M2 remove Yahoo provider from registry and preview regression (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-yahoo-removal-tests-once.yml']
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Verify Yahoo removed from M2 source registry and quote preview once'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
          MYSQL_DATABASE: m2_unit_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-test-only"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with: {php-version: '8.4', extensions: pdo_mysql, coverage: none}
      - name: Verify provider absent means zero calls, ISIN-MIC route, original EUR fallbacks and existing collector
        env:
          M2_LOCAL_MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=m2_unit_test;charset=utf8mb4
          M2_LOCAL_MYSQL_PASSWORD: local-test-only
        run: |
          php -l api/market_sources.php
          php -l tests/test_market_tick_sources.php
          php -l api/isin_quote.php
          python3 -m py_compile tests/test_isin_quote.py
          php -l tests/fixtures/isin_quote_all_test.php
          php -l api/market_core/eodhd.php
          php -l scripts/market_collector/mosa_tick.php
          php -l tests/test_eodhd_provider.php
          php tests/test_eodhd_provider.php
          php tests/test_twelve_data_provider.php
          php tests/test_market_tick_sources.php
          php tests/test_m2_native_quote_route.php
          php tests/test_market_batch_scope.php
          php tests/test_market_registry_model.php
          php tests/test_twelve_data_budget_mysql.php
          php tests/test_eodhd_mysql.php
          php tests/fixtures/isin_quote_all_test.php
          node tests/isin_refresh_browser_check.cjs
          node tests/isin_details_browser_check.cjs
          python3 -B -m unittest discover -s tests -p 'test_isin_quote.py' -v
          node tests/isin_automation_browser_check.cjs
          python3 scripts/build_pages.py --check
