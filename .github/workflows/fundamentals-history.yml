name: MOSA-2 testsite historical fundamentals
run-name: History ${{ github.event_name == 'pull_request' && 'offline checks' || inputs.operation || 'queue' }} ${{ inputs.request_id }}
on:
  pull_request:
    paths:
      - '.github/workflows/fundamentals-history.yml'
      - 'scripts/fundamentals_history.py'
      - 'scripts/fundamentals/history_queue_remote.py'
      - 'tests/test_fundamentals_history.py'
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Create the private queue or process one authenticated request
        required: true
        type: choice
        options: [setup, process]
      request_id:
        description: Request ID from the testsite (empty for setup)
        type: string
      expected_commit:
        description: Exact reviewed main SHA
        required: true
        type: string
      authorization:
        description: MOSA2-HISTORY-operation:commit:request_id
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mosa2-test-fundamentals-history
  cancel-in-progress: false
jobs:
  history:
    if: github.repository == 'masterxfix/MOSA-2' && github.run_attempt == 1 && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MOSA2_HISTORY_ENABLED == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Pinned SSH and report dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/history"
          "$RUNNER_TEMP/history/bin/python" -m pip install --disable-pip-version-check --retries 0 -r scripts/requirements-deploy.txt -r scripts/requirements-esef.txt -r scripts/requirements-fundamentals-pdf.txt
      - name: History, importer and web regressions
        run: |
          php -l scripts/fundamentals/core.php
          php -l api/fundamentals_history.php
          PYTHONPATH=.:tests "$RUNNER_TEMP/history/bin/python" -B -m unittest -v test_fundamentals_history test_fundamentals_generic test_fundamentals_web
      - name: Set up or process the private testsite queue
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          AUTHORIZATION: ${{ inputs.authorization }}
          HISTORY_OPERATION: ${{ inputs.operation }}
          HISTORY_REQUEST_ID: ${{ inputs.request_id }}
          HISTORY_ENABLED: ${{ vars.MOSA2_HISTORY_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
          MOSA_TEST_DB_PASSWORD: ${{ inputs.operation != 'setup' && secrets.MOSA_TEST_DB_PASSWORD || '' }}
        run: '"$RUNNER_TEMP/history/bin/python" -B scripts/fundamentals_history.py'
