name: M2 generic compact name regression and testsite rollout (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2-compact-name-rollout-once.yml']
permissions:
  contents: read
concurrency:
  group: mosa2-testsite-sftp
  cancel-in-progress: false
jobs:
  test_and_deploy:
    if: github.repository == 'masterxfix/MOSA-2' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Deploy compact general M2 security names after regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify generated site, browser behavior and identity safety
        run: |
          python3 scripts/build_pages.py --check
          node --check assets/js/isin_quotes.js
          node tests/isin_automation_browser_check.cjs
          node tests/isin_refresh_browser_check.cjs
          node tests/isin_browser_check.cjs
          python3 -m unittest discover -s tests -p 'test_isin_quote.py' -v
          python3 -m unittest discover -s tests -p 'test_deploy*.py' -v
          python3 scripts/deploy_sftp.py validate
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
      - name: Backup and deploy only market page and shared ISIN display script
        env:
          MOSA_TEST_SFTP_FILES: '["marktdaten.html","assets/js/isin_quotes.js"]'
          MOSA_TEST_SFTP_HOST: ${{ vars.MOSA_TEST_SFTP_HOST }}
          MOSA_TEST_SFTP_PORT: ${{ vars.MOSA_TEST_SFTP_PORT }}
          MOSA_TEST_SFTP_USER: ${{ vars.MOSA_TEST_SFTP_USER }}
          MOSA_TEST_SFTP_PATH: ${{ vars.MOSA_TEST_SFTP_PATH }}
          MOSA_TEST_SFTP_PASSWORD: ${{ secrets.MOSA_TEST_SFTP_PASSWORD }}
          MOSA_TEST_SFTP_HOST_KEY_SHA256: ${{ secrets.MOSA_TEST_SFTP_HOST_KEY_SHA256 }}
        run: |
          python3 -B scripts/deploy_test_sftp.py check-config
          python3 -B scripts/deploy_test_sftp.py backup
          python3 -B scripts/deploy_test_sftp.py deploy
